services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mosaic
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: mosaic
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mosaic -d mosaic']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mosaic_pgdata:/var/lib/postgresql/data

volumes:
  mosaic_pgdata:
