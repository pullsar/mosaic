name: verify-m05-m06-reconcile-once

on:
  push:
    branches: ['agent/m05-m06-reconcile-watchdog-20260827']
    paths:
      - '.github/workflows/verify-m05-m06-reconcile-once.yml'

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: pullsar/mosaic
      CONTROL_BRANCH: agent/m05-m06-authoritative-reconcile-20260827
      WATCHDOG_BRANCH: agent/m05-m06-reconcile-watchdog-20260827
      RENDERER_BRANCH: agent/m06-play-renderer-20260827
      WORKFLOW_NAME: authoritative-m05-m06-reconcile-v2-once
    steps:
      - name: Wait for authoritative reconciliation
        id: run
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 360); do
            runs=$(gh api -X GET "repos/$REPOSITORY/actions/runs" -f branch="$CONTROL_BRANCH" -f per_page=100)
            run_id=$(jq -r --arg name "$WORKFLOW_NAME" '[.workflow_runs[] | select(.name == $name)] | sort_by(.created_at) | last | .id // empty' <<<"$runs")
            if [[ -n "$run_id" ]]; then
              status=$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq .status)
              echo "authoritative run $run_id: $status"
              if [[ "$status" == completed ]]; then
                conclusion=$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq .conclusion)
                echo "id=$run_id" >> "$GITHUB_OUTPUT"
                echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo 'Authoritative reconciliation did not complete within the verification window.' >&2
          exit 1

      - name: Preserve failure diagnostics
        if: steps.run.outputs.conclusion != 'success'
        shell: bash
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" diagnostics
          cd diagnostics
          git checkout "$WATCHDOG_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p diagnostics
          gh run view "$RUN_ID" --repo "$REPOSITORY" --json databaseId,status,conclusion,headSha,jobs > diagnostics/reconcile-run.json
          gh run view "$RUN_ID" --repo "$REPOSITORY" --log-failed > diagnostics/reconcile-failure.log || true
          git add diagnostics
          git commit -m 'diagnostics: preserve failed reconciliation logs'
          git push origin HEAD:"$WATCHDOG_BRANCH"

          issue=3
          [[ "$(gh issue view 13 --repo "$REPOSITORY" --json state --jq .state)" == OPEN ]] && issue=13
          [[ "$issue" == 3 && "$(gh issue view 14 --repo "$REPOSITORY" --json state --jq .state)" == OPEN ]] && issue=14
          failed=$(jq -r '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' diagnostics/reconcile-run.json)
          gh issue comment "$issue" --repo "$REPOSITORY" --body "Authoritative reconciliation run $RUN_ID stopped at: ${failed:-unknown job}. Full failed-job logs are preserved on \`$WATCHDOG_BRANCH\` under \`diagnostics/\`; no blocked feature was merged."
          exit 1

      - name: Verify merged foundations and exact renderer PR head
        if: steps.run.outputs.conclusion == 'success'
        id: state
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh issue view 13 --repo "$REPOSITORY" --json state --jq .state)" == CLOSED ]]
          [[ "$(gh issue view 14 --repo "$REPOSITORY" --json state --jq .state)" == CLOSED ]]

          main_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          renderer_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/$RENDERER_BRANCH" --jq .object.sha)
          pr=$(gh pr list --repo "$REPOSITORY" --state open --head "$RENDERER_BRANCH" --base main --json number,headRefOid,isDraft --jq '.[0]')
          [[ "$pr" != null ]]
          pr_number=$(jq -r .number <<<"$pr")
          pr_sha=$(jq -r .headRefOid <<<"$pr")
          [[ "$pr_sha" == "$renderer_sha" ]]

          for path in \
            apps/mosaic_app/ios/Runner/InfoPlist.xcstrings \
            apps/mosaic_app/ios/Runner/PrivacyInfo.xcprivacy \
            packages/local_state/lib \
            docs/local-persistence-and-recovery.md; do
            gh api "repos/$REPOSITORY/contents/$path?ref=main" >/dev/null
          done
          for path in \
            packages/play_flutter/lib/src/play_visual_renderer.dart \
            packages/play_flutter/test/play_visual_renderer_test.dart \
            .github/workflows/renderer-ci.yml \
            docs/progress/2026-08-27-m06-play-renderer-progress.md; do
            gh api "repos/$REPOSITORY/contents/$path?ref=$RENDERER_BRANCH" >/dev/null
          done

          for temporary in \
            .github/workflows/release-platform-lifecycle-once.yml \
            .github/workflows/release-platform-lifecycle-v2-once.yml \
            .github/workflows/release-local-recovery-once.yml \
            .github/workflows/release-local-recovery-v2-once.yml; do
            if gh api "repos/$REPOSITORY/contents/$temporary?ref=main" >/dev/null 2>&1; then
              echo "Temporary release workflow leaked into main: $temporary" >&2
              exit 1
            fi
          done

          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "renderer_sha=$renderer_sha" >> "$GITHUB_OUTPUT"
          echo "pr=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Record verification and remove watchdog branch
        if: steps.run.outputs.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 3 --repo "$REPOSITORY" --body "Independent verification passed: #13 and #14 are on main at \`${{ steps.state.outputs.main_sha }}\`; renderer tranche #${{ steps.state.outputs.pr }} is open at exact tested head \`${{ steps.state.outputs.renderer_sha }}\`."
          gh api -X DELETE "repos/$REPOSITORY/git/refs/heads/$WATCHDOG_BRANCH" >/dev/null
