name: update-worker-attempt-keys-once

on:
  push:
    branches: [agent/m07-ffmpeg-worker-20260828]
    paths:
      - '.github/workflows/update-worker-attempt-keys-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mosaic
          POSTGRES_USER: mosaic
          POSTGRES_PASSWORD: mosaic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mosaic -d mosaic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mosaic:mosaic@localhost:5432/mosaic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/m07-ffmpeg-worker-20260828
      - name: Update tests for attempt-scoped keys
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/api/test/media_ffmpeg_worker.test.ts')
          s = p.read_text()
          s = s.replace(
              "  processFfmpegDerivative,\n",
              "  mediaAttemptStorageKey,\n  processFfmpegDerivative,\n",
              1,
          )
          s = s.replace(
              "  assert.equal(request.storageKey, 'public/asset_worker/playback.mp4');\n",
              "",
              1,
          )
          s = s.replace(
              "  assert.equal(request.storageKey, 'public/asset_worker/playback.mp4');\n",
              "  assert.equal(\n    request.storageKey,\n    mediaAttemptStorageKey(assetId, derivativeKey, 'claim-token', 'playback'),\n  );\n",
              1,
          )
          s = s.replace("      outputStorageKey: 'public/asset_worker/playback.mp4',\n", "")
          s = s.replace("      outputStorageKey: 'public/asset_worker/captions.vtt',\n", "")
          s = s.replace(
              "  assert.equal(repository.current?.storageKey, 'public/asset_worker/playback.mp4');\n",
              "  assert.equal(\n    repository.current?.storageKey,\n    mediaAttemptStorageKey(assetId, derivativeKey, 'claim-token', 'playback'),\n  );\n",
              1,
          )
          p.write_text(s)

          p = Path('apps/api/test/media_ffprobe.test.ts')
          s = p.read_text()
          s = s.replace("    storageKey: 'public/playback.mp4',\n", "")
          p.write_text(s)
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/api
        run: npm ci --ignore-scripts
      - name: Validate API
        working-directory: apps/api
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Remove one-shot workflow
        run: rm .github/workflows/update-worker-attempt-keys-once.yml
      - name: Commit validated migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/test/media_ffmpeg_worker.test.ts apps/api/test/media_ffprobe.test.ts .github/workflows/update-worker-attempt-keys-once.yml
          git commit -m 'test(media): use claim-scoped published artifact keys'
          git push origin HEAD:agent/m07-ffmpeg-worker-20260828
