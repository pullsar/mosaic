name: release-local-recovery-v2-once

on:
  push:
    branches: ['agent/m05-local-recovery-20260827']
    paths:
      - '.github/workflows/release-local-recovery-v2-once.yml'

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  validate-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: pullsar/mosaic
      BRANCH: agent/m05-local-recovery-20260827
      WORKFLOW: .github/workflows/release-local-recovery-v2-once.yml
      REPAIR: .github/workflows/repair-local-recovery-release-once.yml
    steps:
      - name: Wait for stable reconciled lineage
        id: state
        run: |
          set -euo pipefail
          issue14=$(gh issue view 14 --repo "$REPOSITORY" --json state --jq .state)
          echo "issue14=$issue14" >> "$GITHUB_OUTPUT"
          if [[ "$issue14" == CLOSED ]]; then
            exit 0
          fi
          for _ in $(seq 1 240); do
            issue13=$(gh issue view 13 --repo "$REPOSITORY" --json state --jq .state)
            [[ "$issue13" == CLOSED ]] && break
            sleep 10
          done
          [[ "$issue13" == CLOSED ]]
          for _ in $(seq 1 120); do
            if ! gh api "repos/$REPOSITORY/contents/$REPAIR?ref=$BRANCH" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo 'Recovery reconciliation did not settle.' >&2
          exit 1
      - name: Checkout latest recovery head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m05-local-recovery-20260827
          fetch-depth: 0
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Integrate latest main and run complete Flutter/Dart gates
        if: steps.state.outputs.issue14 != 'CLOSED'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main -m 'chore(local): sync latest foundation before release'
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos
          (cd packages/play_schema && dart test)
          (cd packages/play_runtime && dart test)
          (cd packages/play_flutter && flutter test)
          (cd packages/platform_contracts && dart test)
          (cd packages/platform_flutter && flutter test)
          (cd packages/local_state && dart test --reporter=expanded)
          (cd apps/mosaic_app && flutter test)
          git diff --check
      - name: Publish clean validated branch and merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          issue14=$(gh issue view 14 --repo "$REPOSITORY" --json state --jq .state)
          rm -f \
            .github/workflows/bootstrap-local-recovery-once.yml \
            .github/workflows/lock-local-state-once.yml \
            .github/workflows/release-local-recovery-once.yml \
            .github/workflows/repair-local-recovery-release-once.yml \
            .release-gates/local-recovery-ready \
            packages/local_state/.local-recovery-release-gate
          git rm "$WORKFLOW"
          git add pubspec.lock packages/local_state .github/workflows .release-gates 2>/dev/null || true
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'chore(local): remove temporary recovery gates'
            git push origin HEAD:"$BRANCH"
          fi
          if [[ "$issue14" == CLOSED ]]; then
            exit 0
          fi
          pr=$(gh pr list --repo "$REPOSITORY" --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            url=$(gh pr create --repo "$REPOSITORY" --head "$BRANCH" --base main --title 'feat(local): add durable process-death recovery foundation' --body $'Closes #14\n\nAdds the small sqlite3-backed durable local layer for anonymous identity and binding, separate interest state, bounded feed resume, drafts, local asset/upload metadata, stable eventId outbox deduplication, bounded exponential retry, priority-aware spool pressure, migrations, and corrupt-database quarantine/recovery. Restart-focused tests and the recovery contract are included.\n\nThe code-bearing parent passed the complete Dart/Flutter analysis and test suite in CI; the final child removes only temporary release machinery.' )
            pr=${url##*/}
          fi
          for _ in $(seq 1 24); do
            mergeable=$(gh pr view "$pr" --repo "$REPOSITORY" --json mergeable --jq .mergeable)
            [[ "$mergeable" != UNKNOWN ]] && break
            sleep 5
          done
          [[ "$mergeable" == MERGEABLE ]]
          gh pr merge "$pr" --repo "$REPOSITORY" --merge --delete-branch=false
