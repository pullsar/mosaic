name: local-recovery-ci

on:
  push:
    branches: ['**']
    paths:
      - 'packages/local_state/**'
      - 'docs/local-persistence-and-recovery.md'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/local-recovery-ci.yml'
  pull_request:
    paths:
      - 'packages/local_state/**'
      - 'docs/local-persistence-and-recovery.md'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/local-recovery-ci.yml'

concurrency:
  group: local-recovery-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed packages/local_state
      - name: Analyze local state
        run: dart analyze packages/local_state --fatal-infos
      - name: Test restart and recovery contracts
        working-directory: packages/local_state
        run: dart test --reporter=expanded
