name: agent-m2-ranking-patch

on:
  push:
    branches: ['agent/m2-ranking-signals-20260830']
    paths: ['.github/workflows/agent-m2-ranking-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m2-ranking-signals-20260830
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Apply exact telemetry and advance patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          feed = 'apps/mosaic_app/lib/consumer_feed.dart'
          replace_once(feed, '''final class ConsumerFeedController {
            Future<bool> Function()? _advance;
            bool get attached => _advance != null;
            Future<bool> advance() async {
              final callback = _advance;
              return callback == null ? false : callback();
            }

            void _attach(Future<bool> Function() callback) => _advance = callback;
            void _detach(Future<bool> Function() callback) {
              if (identical(_advance, callback)) _advance = null;
            }
          }
          '''.replace('          ', ''), '''enum ConsumerFeedAdvanceReason {
            notInterested('not_interested'),
            topicMuted('topic_muted'),
            reported('reported');

            const ConsumerFeedAdvanceReason(this.wireName);
            final String wireName;
          }

          final class ConsumerFeedController {
            Future<bool> Function(ConsumerFeedAdvanceReason reason)? _advance;
            bool get attached => _advance != null;

            Future<bool> advance(ConsumerFeedAdvanceReason reason) async {
              final callback = _advance;
              return callback == null ? false : callback(reason);
            }

            void _attach(
              Future<bool> Function(ConsumerFeedAdvanceReason reason) callback,
            ) => _advance = callback;

            void _detach(
              Future<bool> Function(ConsumerFeedAdvanceReason reason) callback,
            ) {
              if (identical(_advance, callback)) _advance = null;
            }
          }
          '''.replace('          ', ''))

          replace_once(feed, '''  bool _booting = true;
            bool _fetching = false;
            bool _directManipulationActive = false;
          '''.replace('          ', ''), '''  bool _booting = true;
            bool _fetching = false;
            bool _directManipulationActive = false;
            String? _pendingAdvanceIdentity;
            ConsumerFeedAdvanceReason? _pendingAdvanceReason;
          '''.replace('          ', ''))

          old_advance = '''  Future<bool> _requestAdvance() async {
            if (!mounted || _entries.isEmpty || _directManipulationActive) {
              return false;
            }
            final currentIdentity = _entries[_currentIndex].analyticsIdentity;
            Future<bool> advanceLoaded() async {
              if (!mounted ||
                  _entries.isEmpty ||
                  _currentIndex >= _entries.length ||
                  _entries[_currentIndex].analyticsIdentity != currentIdentity ||
                  _currentIndex + 1 >= _entries.length) {
                return false;
              }
              await _pageController.nextPage(
                duration: const Duration(milliseconds: 180),
                curve: Curves.easeOutCubic,
              );
              return true;
            }

            if (await advanceLoaded()) return true;
            final cursor = _nextCursor;
            if (cursor == null || _fetching) return false;
            await _fetchPage(cursor, epoch: _loadEpoch);
            return advanceLoaded();
          }
          '''.replace('          ', '')
          new_advance = '''  Future<bool> _requestAdvance(ConsumerFeedAdvanceReason reason) async {
            if (!mounted || _entries.isEmpty || _directManipulationActive) {
              return false;
            }
            final currentIdentity = _entries[_currentIndex].analyticsIdentity;
            Future<bool> advanceLoaded() async {
              if (!mounted ||
                  _entries.isEmpty ||
                  _currentIndex >= _entries.length ||
                  _entries[_currentIndex].analyticsIdentity != currentIdentity ||
                  _currentIndex + 1 >= _entries.length) {
                return false;
              }
              _pendingAdvanceIdentity = currentIdentity;
              _pendingAdvanceReason = reason;
              try {
                await _pageController.nextPage(
                  duration: const Duration(milliseconds: 180),
                  curve: Curves.easeOutCubic,
                );
              } finally {
                if (_pendingAdvanceIdentity == currentIdentity) {
                  _pendingAdvanceIdentity = null;
                  _pendingAdvanceReason = null;
                }
              }
              return true;
            }

            if (await advanceLoaded()) return true;
            final cursor = _nextCursor;
            if (cursor == null || _fetching) return false;
            await _fetchPage(cursor, epoch: _loadEpoch);
            return advanceLoaded();
          }
          '''.replace('          ', '')
          replace_once(feed, old_advance, new_advance)

          replace_once(feed, '''    setState(() {
              _currentIndex = index;
              _directManipulationActive = false;
              _trimRetainedWindow();
            });

            _emitDismissed(previous);
          '''.replace('          ', ''), '''    final programmaticReason =
                _pendingAdvanceIdentity == previous.analyticsIdentity
                ? _pendingAdvanceReason
                : null;
            _pendingAdvanceIdentity = null;
            _pendingAdvanceReason = null;

            setState(() {
              _currentIndex = index;
              _directManipulationActive = false;
              _trimRetainedWindow();
            });

            _emitDismissed(
              previous,
              reason: programmaticReason?.wireName ?? 'swipe',
            );
          '''.replace('          ', ''))

          replace_once(feed, '''  void _emitDismissed(_FeedEntry entry) {
            widget.onEvent?.call(
              MosaicEventName.playDismissed,
              feedRequestId: entry.requestId,
              playRevisionId: entry.item.revisionId,
              payload: <String, Object?>{
                'playId': entry.item.playId,
                'reason': 'swipe',
              },
            );
          }
          '''.replace('          ', ''), '''  void _emitDismissed(_FeedEntry entry, {required String reason}) {
            widget.onEvent?.call(
              MosaicEventName.playDismissed,
              feedRequestId: entry.requestId,
              playRevisionId: entry.item.revisionId,
              payload: <String, Object?>{
                'playId': entry.item.playId,
                'reason': reason,
              },
            );
          }
          '''.replace('          ', ''))

          controls = 'apps/mosaic_app/lib/consumer_action_controls.dart'
          replace_once(controls, "import 'consumer_api_client.dart';\n", "import 'consumer_api_client.dart';\nimport 'consumer_feed.dart';\n")
          replace_once(controls, '  final Future<bool> Function() onAdvance;\n', '  final Future<bool> Function(ConsumerFeedAdvanceReason reason) onAdvance;\n')
          replace_once(controls, '    if (applied) await widget.onAdvance();\n', '    if (applied) {\n      await widget.onAdvance(ConsumerFeedAdvanceReason.notInterested);\n    }\n')
          replace_once(controls, '    if (applied && muted) await widget.onAdvance();\n', '    if (applied && muted) {\n      await widget.onAdvance(ConsumerFeedAdvanceReason.topicMuted);\n    }\n')
          replace_once(controls, '    if (reported) await widget.onAdvance();\n', '    if (reported) {\n      await widget.onAdvance(ConsumerFeedAdvanceReason.reported);\n    }\n')

          main = 'apps/mosaic_app/lib/main.dart'
          replace_once(main, "import 'onboarding_localizations.dart';\n", "import 'onboarding_localizations.dart';\nimport 'play_resolution_telemetry.dart';\n")
          replace_once(main, '''      mediaBuilder: media.call,
            onDirectManipulationChanged: onDirectManipulationChanged,
          );
          '''.replace('          ', ''), '''      mediaBuilder: media.call,
            onResolved: (resolution) => recordPlayResolutionTelemetry(
              telemetry,
              playId: item.playId,
              outcome: resolution.outcome,
              attempts: resolution.session.attempts,
              completed: resolution.session.ended,
              correct: resolution.wasCorrect,
            ),
            onDirectManipulationChanged: onDirectManipulationChanged,
          );
          '''.replace('          ', ''))

          controls_test = 'apps/mosaic_app/test/consumer_action_controls_test.dart'
          replace_once(controls_test, "import 'package:mosaic_app/consumer_local_state.dart';\n", "import 'package:mosaic_app/consumer_local_state.dart';\nimport 'package:mosaic_app/consumer_feed.dart';\n")
          replace_once(controls_test, '''  var eventId = 0;
            var advances = 0;

            Future<bool> advance() async {
              advances += 1;
              return true;
            }
          '''.replace('          ', ''), '''  var eventId = 0;
            var advances = 0;
            final advanceReasons = <ConsumerFeedAdvanceReason>[];

            Future<bool> advance(ConsumerFeedAdvanceReason reason) async {
              advances += 1;
              advanceReasons.add(reason);
              return true;
            }
          '''.replace('          ', ''))
          replace_once(controls_test, '    expect(harness.advances, 1);\n  });\n\n  testWidgets(\'muting the current topic is durable and advances\'', '    expect(harness.advances, 1);\n    expect(harness.advanceReasons, <ConsumerFeedAdvanceReason>[\n      ConsumerFeedAdvanceReason.notInterested,\n    ]);\n  });\n\n  testWidgets(\'muting the current topic is durable and advances\'')
          replace_once(controls_test, '    expect(harness.controller.isTopicMuted(\'testing\'), isTrue);\n    expect(harness.advances, 1);\n', '    expect(harness.controller.isTopicMuted(\'testing\'), isTrue);\n    expect(harness.advances, 1);\n    expect(harness.advanceReasons, <ConsumerFeedAdvanceReason>[\n      ConsumerFeedAdvanceReason.topicMuted,\n    ]);\n')

          projector = Path('apps/api/src/consumer_signal_projector.ts')
          ptext = projector.read_text()
          start = ptext.index("    case 'play_not_interested':")
          end = ptext.index("    default:\n      return;", start)
          ptext = ptext[:start] + "    case 'play_not_interested':\n    case 'more_like_this':\n      // Explicit one-shot actions are derived from actor_play_signals, whose\n      // primary key prevents a new event ID from multiplying the same intent.\n      return;\n" + ptext[end:]
          projector.write_text(ptext)

          repository = Path('apps/api/src/consumer_repository.ts')
          rtext = repository.read_text()
          rtext = rtext.replace(
              "const AFFINITY_MAX_AGE_MS = 90 * 24 * 60 * 60 * 1000;\n",
              "const AFFINITY_MAX_AGE_MS = 90 * 24 * 60 * 60 * 1000;\nconst MORE_LIKE_TTL_MS = 14 * 24 * 60 * 60 * 1000;\n",
              1,
          )
          method_start = rtext.index('  async getDerivedRankingProfile(')
          method_end = rtext.index('  async getActionState(', method_start)
          new_method = '''  async getDerivedRankingProfile(
            actorId: string,
          ): Promise<DerivedConsumerRankingProfile | null> {
            const normalizedActorId = requiredText(actorId, 'actorId');
            const result = await this.pool.query<{
              interaction_affinity: unknown;
              recent_revisions: unknown;
              format_dismissal_counts: unknown;
            }>(
              `select interaction_affinity,
                      recent_revisions,
                      format_dismissal_counts
                 from consumer_signal_profiles
                where actor_id = $1`,
              [normalizedActorId],
            );
            const row = result.rows[0];
            if (!row) return null;
            const now = Date.now();
            const formatDismissalCounts = decodeCountsForRanking(
              row.format_dismissal_counts,
              now,
            );
            const topicDismissalCounts: Record<string, number> = {};
            const moreLikeTopics = new Set<string>();
            const actions = await this.pool.query<{
              signal: 'more_like_this' | 'not_interested';
              first_received_at: string;
              format: string | null;
              topic_ids: string[];
            }>(
              `select signal.signal,
                      signal.first_received_at::text as first_received_at,
                      revision.document ->> 'format' as format,
                      coalesce((
                        select array_agg(topic.topic_id order by topic.topic_id)
                          from (
                            select distinct link.topic_id
                              from play_revision_topics link
                             where link.play_id = signal.play_id
                               and link.revision_id = signal.revision_id
                          ) topic
                      ), array[]::text[]) as topic_ids
                 from actor_play_signals signal
                 join play_revisions revision
                   on revision.play_id = signal.play_id
                  and revision.revision_id = signal.revision_id
                where signal.actor_id = $1
                  and signal.signal in ('more_like_this', 'not_interested')
                order by signal.signal, signal.play_id`,
              [normalizedActorId],
            );
            for (const action of actions.rows) {
              const receivedAt = Date.parse(action.first_received_at);
              if (!Number.isFinite(receivedAt)) {
                throw new Error('Consumer action signal receipt time is corrupt.');
              }
              const age = Math.max(0, now - receivedAt);
              const topics = [...new Set(action.topic_ids.map((topic) => topic.trim().toLowerCase()))]
                .filter(Boolean);
              if (action.signal === 'more_like_this') {
                if (age <= MORE_LIKE_TTL_MS) {
                  for (const topic of topics) moreLikeTopics.add(topic);
                }
                continue;
              }
              if (age > DISMISSAL_TTL_MS) continue;
              for (const topic of topics) incrementCount(topicDismissalCounts, topic);
              const format = action.format?.trim().toLowerCase();
              if (format) incrementCount(formatDismissalCounts, format);
            }
            return {
              interactionAffinity: decodeAffinityForRanking(row.interaction_affinity, now),
              recentPlayRevisionKeys: decodeRecentRevisionsForRanking(
                row.recent_revisions,
                now,
              ),
              topicDismissalCounts,
              formatDismissalCounts,
              moreLikeTopicIds: [...moreLikeTopics].sort(),
            };
          }

          '''.replace('          ', '')
          rtext = rtext[:method_start] + new_method + rtext[method_end:]
          more_start = rtext.find('function decodeMoreLikeTopicsForRanking(')
          if more_start != -1:
              more_end = rtext.index('function requireRecord(', more_start)
              rtext = rtext[:more_start] + rtext[more_end:]
          marker = 'function requireRecord(value: unknown, name: string): Record<string, unknown> {'
          idx = rtext.index(marker)
          increment = '''function incrementCount(target: Record<string, number>, key: string): void {
            target[key] = Math.min(8, (target[key] ?? 0) + 1);
          }

          '''.replace('          ', '')
          rtext = rtext[:idx] + increment + rtext[idx:]
          repository.write_text(rtext)
          PY
          dart format \
            apps/mosaic_app/lib/consumer_feed.dart \
            apps/mosaic_app/lib/consumer_action_controls.dart \
            apps/mosaic_app/lib/main.dart \
            apps/mosaic_app/test/consumer_action_controls_test.dart \
            apps/mosaic_app/lib/play_resolution_telemetry.dart \
            apps/mosaic_app/test/play_resolution_telemetry_test.dart
          git diff --check
          git add \
            apps/mosaic_app/lib/consumer_feed.dart \
            apps/mosaic_app/lib/consumer_action_controls.dart \
            apps/mosaic_app/lib/main.dart \
            apps/mosaic_app/test/consumer_action_controls_test.dart \
            apps/mosaic_app/lib/play_resolution_telemetry.dart \
            apps/mosaic_app/test/play_resolution_telemetry_test.dart \
            apps/api/src/consumer_signal_projector.ts \
            apps/api/src/consumer_repository.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(ranking): correct interaction telemetry and one-shot signals'
          git push origin HEAD:agent/m2-ranking-signals-20260830
