name: m2-temp-format

on:
  push:
    branches: ['agent/m2-visual-onboarding-20260829']

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m2-visual-onboarding-20260829
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Format flagged files and remove formatter workflow
        run: |
          dart format \
            apps/mosaic_app/lib/consumer_onboarding.dart \
            apps/mosaic_app/lib/onboarding_localizations.dart \
            apps/mosaic_app/test/consumer_runtime_test.dart
          git rm .github/workflows/m2-temp-format.yml
          if git diff --quiet --cached && git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mosaic_app/lib/consumer_onboarding.dart \
                  apps/mosaic_app/lib/onboarding_localizations.dart \
                  apps/mosaic_app/test/consumer_runtime_test.dart
          git commit -m 'chore: format m2 onboarding'
          git push origin HEAD:agent/m2-visual-onboarding-20260829
