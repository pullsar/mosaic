name: agent-m2-ranking-finalize

on:
  push:
    branches: ['agent/m2-ranking-signals-20260830']
    paths: ['.github/workflows/agent-m2-ranking-finalize.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mosaic
          POSTGRES_USER: mosaic
          POSTGRES_PASSWORD: mosaic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mosaic -d mosaic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mosaic:mosaic@localhost:5432/mosaic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m2-ranking-signals-20260830
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Apply final ranking-signal changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Keep derived ranking state in one owner: the projector. Explicit
          # one-shot actions stay canonical in actor_play_signals.
          repo = Path('apps/api/src/consumer_repository.ts')
          text = repo.read_text()
          old_import = """import {
            feedCandidateIdentity,
            type FeedCandidate,
            type FeedSourceBucket,
            type RankedFeedCandidate,
          } from './consumer_ranking.js';
          """.replace('          ', '')
          new_import = """import {
            type FeedCandidate,
            type FeedSourceBucket,
            type RankedFeedCandidate,
          } from './consumer_ranking.js';
          """.replace('          ', '')
          if text.count(old_import) != 1:
              raise SystemExit('consumer_repository.ts: ranking import shape changed')
          text = text.replace(old_import, new_import, 1)
          for line in [
              'const RECENT_REVISION_TTL_MS = 7 * 24 * 60 * 60 * 1000;\n',
              'const DISMISSAL_TTL_MS = 30 * 24 * 60 * 60 * 1000;\n',
              'const AFFINITY_HALF_LIFE_MS = 30 * 24 * 60 * 60 * 1000;\n',
              'const AFFINITY_MAX_AGE_MS = 90 * 24 * 60 * 60 * 1000;\n',
          ]:
              if text.count(line) != 1:
                  raise SystemExit(f'consumer_repository.ts: expected constant {line!r}')
              text = text.replace(line, '', 1)
          interface_start = text.index('export interface DerivedConsumerRankingProfile {')
          interface_end = text.index('export interface PlayActionState {', interface_start)
          text = text[:interface_start] + text[interface_end:]
          method_decl = '  getDerivedRankingProfile?(actorId: string): Promise<DerivedConsumerRankingProfile | null>;\n'
          if text.count(method_decl) != 1:
              raise SystemExit('consumer_repository.ts: derived repository contract changed')
          text = text.replace(method_decl, '', 1)
          method_start = text.index('  async getDerivedRankingProfile(')
          method_end = text.index('  async getActionState(', method_start)
          text = text[:method_start] + text[method_end:]
          helper_start = text.index('function decodeAffinityForRanking(')
          helper_end = text.index('function normalizeTopicIds(', helper_start)
          text = text[:helper_start] + text[helper_end:]
          repo.write_text(text)

          projector = 'apps/api/src/consumer_signal_projector.ts'
          replace_once(
              projector,
              '    this.clock = options.clock ?? Date.new;\n',
              '    this.clock = options.clock ?? (() => new Date());\n',
          )
          replace_once(
              projector,
              """      const format = optionalText(action.format)?.toLowerCase();
                if (format !== null) incrementCount(formatDismissalCounts, format);
              """.replace('              ', ''),
              """      const format = optionalText(action.format);
                if (format !== null) incrementCount(formatDismissalCounts, format.toLowerCase());
              """.replace('              ', ''),
          )
          replace_once(
              projector,
              """      where event.actor_id = $1
                    and (
              """.replace('              ', ''),
              """      where event.actor_id = $1
                    and event.event_name in ('play_visible', 'play_resolved', 'play_dismissed')
                    and (
              """.replace('              ', ''),
          )

          # Migration 008 is now the first rollback step and must be tested as
          # such before the existing migration 007 rollback assertions.
          postgres_test = 'apps/api/test/postgres.test.ts'
          replace_once(
              postgres_test,
              """  await runMigration('down');
                const actionsDownPool = new Pool({connectionString: databaseUrl});
              """.replace('              ', ''),
              """  await runMigration('down');
                const profileDownPool = new Pool({connectionString: databaseUrl});
                try {
                  const afterProfileDown = await profileDownPool.query<{
                    consumer_signal_profiles: string | null;
                    actor_topic_mutes: string | null;
                  }>(
                    `select to_regclass('public.consumer_signal_profiles')::text as consumer_signal_profiles,
                            to_regclass('public.actor_topic_mutes')::text as actor_topic_mutes`,
                  );
                  assert.equal(afterProfileDown.rows[0]?.consumer_signal_profiles, null);
                  assert.equal(afterProfileDown.rows[0]?.actor_topic_mutes, 'actor_topic_mutes');
                } finally {
                  await profileDownPool.end();
                }

                await runMigration('down');
                const actionsDownPool = new Pool({connectionString: databaseUrl});
              """.replace('              ', ''),
          )

          # Projector regression expectations now reflect that explicit
          # one-shot actions are read from actor_play_signals rather than
          # replayed into duplicate JSON state.
          projection_test = 'apps/api/test/consumer_signal_projector_postgres.test.ts'
          replace_once(
              projection_test,
              """      assert.equal(await projector.projectActor(actorId), 2);
                    assert.equal(await projector.projectActor(actorId), 2);
                    assert.equal(await projector.projectActor(actorId), 0);
              """.replace('              ', ''),
              """      assert.equal(await projector.projectActor(actorId), 2);
                    assert.equal(await projector.projectActor(actorId), 0);
              """.replace('              ', ''),
          )
          replace_once(
              projection_test,
              """      const concurrent = await Promise.all([
                    projector.projectActor(actorId),
                    projector.projectActor(actorId),
                  ]);
                  assert.equal(concurrent.reduce((sum, value) => sum + value, 0), 1);
                  const repeated = await consumer.getDerivedRankingProfile(actorId);
              """.replace('              ', ''),
              """      const concurrent = await Promise.all([
                    projector.projectActor(actorId),
                    projector.projectActor(actorId),
                  ]);
                  assert.equal(concurrent.reduce((sum, value) => sum + value, 0), 0);
                  const repeated = await projector.readActorProfile(actorId);
              """.replace('              ', ''),
          )
          replace_once(
              projection_test,
              '      const first = await consumer.getDerivedRankingProfile(actorId);\n',
              '      const first = await projector.readActorProfile(actorId);\n',
          )
          replace_once(
              projection_test,
              '      const bounded = await consumer.getDerivedRankingProfile(actorId);\n',
              '      const bounded = await projector.readActorProfile(actorId);\n',
          )
          replace_once(
              projection_test,
              """      assert.equal(bounded?.formatDismissalCounts.choose, 2);

                    const beforeRebuild = await rawProjection(pool, actorId);
                    const rebuiltEvents = await projector.rebuildActor(actorId);
                    assert.ok(rebuiltEvents >= 5);
              """.replace('              ', ''),
              """      assert.equal(bounded?.formatDismissalCounts.choose, 2);

                    const clockAnchor = Date.now();
                    const afterMoreLikeExpiry = await new PostgresConsumerSignalProjector(pool, {
                      clock: () => new Date(clockAnchor + 15 * 24 * 60 * 60 * 1000),
                    }).readActorProfile(actorId);
                    assert.deepEqual(afterMoreLikeExpiry?.moreLikeTopicIds, []);
                    assert.equal(afterMoreLikeExpiry?.topicDismissalCounts[artTopic], 2);

                    const afterDismissalExpiry = await new PostgresConsumerSignalProjector(pool, {
                      clock: () => new Date(clockAnchor + 31 * 24 * 60 * 60 * 1000),
                    }).readActorProfile(actorId);
                    assert.deepEqual(afterDismissalExpiry?.topicDismissalCounts, {});
                    assert.deepEqual(afterDismissalExpiry?.formatDismissalCounts, {});
                    assert.ok((afterDismissalExpiry?.interactionAffinity.guess ?? 0) > 0);

                    const afterAffinityExpiry = await new PostgresConsumerSignalProjector(pool, {
                      clock: () => new Date(clockAnchor + 91 * 24 * 60 * 60 * 1000),
                    }).readActorProfile(actorId);
                    assert.deepEqual(afterAffinityExpiry?.interactionAffinity, {});
                    assert.deepEqual(afterAffinityExpiry?.recentPlayRevisionKeys, []);

                    const beforeRebuild = await rawProjection(pool, actorId);
                    const rebuiltEvents = await projector.rebuildActor(actorId);
                    assert.equal(rebuiltEvents, 2);
              """.replace('              ', ''),
          )
          replace_once(
              projection_test,
              "import {PostgresConsumerRepository} from '../src/consumer_repository.js';\n",
              '',
          )
          replace_once(
              projection_test,
              '    const consumer = new PostgresConsumerRepository(pool);\n',
              '',
          )

          # Feed-level regressions prove derived state affects order and a
          # projection failure never blocks feed availability.
          feed_test = 'apps/api/test/consumer_feed.test.ts'
          replace_once(
              feed_test,
              "import type {FeedCandidate, RankedFeedCandidate} from '../src/consumer_ranking.js';\n",
              "import {feedCandidateIdentity, type FeedCandidate, type RankedFeedCandidate} from '../src/consumer_ranking.js';\n",
          )
          marker = "test('feed window introduces one wildcard only when top window lacks exploration', () => {"
          feed_text = Path(feed_test).read_text()
          if feed_text.count(marker) != 1:
              raise SystemExit('consumer_feed.test.ts: insertion marker changed')
          derived_tests = """test('derived ranking profile changes a fresh decision without changing explicit preferences', async () => {
            const repository = new MemoryConsumerRepository();
            repository.candidates = [
              candidate('seen', 'r1', {curatedOrder: 1}),
              candidate('fresh', 'r2', {curatedOrder: 2}),
            ];
            const projector = {
              projectActor: async (_actorId: string) => 0,
              readActorProfile: async (_actorId: string) => ({
                interactionAffinity: {},
                recentPlayRevisionKeys: [feedCandidateIdentity('seen', 'r1')],
                topicDismissalCounts: {},
                formatDismissalCounts: {},
                moreLikeTopicIds: [],
              }),
              rebuildActor: async (_actorId: string) => 0,
            };
            const service = new ConsumerFeedService(repository, {
              windowSize: 2,
              candidateLimit: 2,
              requestIdFactory: () => 'derived_request',
              signalProjector: projector,
            });

            const page = await service.getFeed({actorId: 'actor_derived', capabilities, limit: 2});
            assert.deepEqual(page.items.map((item) => item.playId), ['fresh', 'seen']);
          });

          test('projection failure falls back to explicit profile without blocking feed', async () => {
            const repository = new MemoryConsumerRepository();
            repository.preferences = {interestTopicIds: ['travel'], learningTopicIds: []};
            repository.candidates = [
              candidate('travel', 'r1', {topicIds: ['travel'], curatedOrder: 2}),
              candidate('other', 'r2', {topicIds: ['music'], curatedOrder: 1}),
            ];
            const errors: unknown[] = [];
            const projector = {
              projectActor: async (_actorId: string) => {
                throw new Error('projection unavailable');
              },
              readActorProfile: async (_actorId: string) => {
                throw new Error('must not be reached');
              },
              rebuildActor: async (_actorId: string) => 0,
            };
            const service = new ConsumerFeedService(repository, {
              windowSize: 2,
              candidateLimit: 2,
              requestIdFactory: () => 'profile_fallback_request',
              signalProjector: projector,
              onProfileError: (error) => errors.push(error),
            });

            const page = await service.getFeed({actorId: 'actor_profile_fallback', capabilities, limit: 2});
            assert.equal(page.items[0]?.playId, 'travel');
            assert.equal(errors.length, 1);
          });

          """.replace('          ', '')
          Path(feed_test).write_text(feed_text.replace(marker, derived_tests + marker, 1))

          # Compound identity regression at the pure ranker boundary.
          ranking_test = 'apps/api/test/consumer_ranking.test.ts'
          ranking_text = Path(ranking_test).read_text()
          rank_marker = "test('no explicit preference produces a deterministic curated fallback order', () => {"
          if ranking_text.count(rank_marker) != 1:
              raise SystemExit('consumer_ranking.test.ts: insertion marker changed')
          identity_test = """test('recent fatigue is scoped to the exact Play plus revision identity', () => {
            const sharedRevision = 'shared_revision';
            const seen = candidate('seen', {qualityPrior: 0.7, curatedOrder: 1});
            const other = candidate('other', {qualityPrior: 0.7, curatedOrder: 2});
            seen.revisionId = sharedRevision;
            other.revisionId = sharedRevision;

            const ranked = rankFeedCandidates([seen, other], {
              interestTopicIds: [],
              learningTopicIds: [],
              recentPlayRevisionKeys: [JSON.stringify([seen.playId, sharedRevision])],
            });

            assert.equal(ranked[0]?.playId, other.playId);
            assert.equal(
              ranked.find((item) => item.playId === other.playId)?.featureContributions.recentSeenPenalty,
              0,
            );
          });

          """.replace('          ', '')
          Path(ranking_test).write_text(ranking_text.replace(rank_marker, identity_test + rank_marker, 1))

          # Client telemetry must never destabilize Play execution. Invalid
          # analytics dimensions are dropped instead of thrown through UI.
          telemetry = 'apps/mosaic_app/lib/play_resolution_telemetry.dart'
          Path(telemetry).write_text("""import 'package:analytics_contract/analytics_contract.dart';
          import 'package:platform_contracts/platform_contracts.dart';

          void recordPlayResolutionTelemetry(
            Telemetry telemetry, {
            required String playId,
            required String outcome,
            required int attempts,
            required bool completed,
            bool? correct,
          }) {
            final normalizedPlayId = _boundedText(playId);
            final normalizedOutcome = _boundedText(outcome);
            if (normalizedPlayId == null ||
                normalizedOutcome == null ||
                attempts < 1 ||
                attempts > 1000) {
              return;
            }
            telemetry.event(MosaicEventName.playResolved, <String, Object?>{
              'playId': normalizedPlayId,
              'outcome': normalizedOutcome,
              'attempt': attempts,
              if (correct != null) 'correct': correct,
            });
            if (completed) {
              telemetry.event(MosaicEventName.playCompleted, <String, Object?>{
                'playId': normalizedPlayId,
                'attempts': attempts,
              });
            }
          }

          String? _boundedText(String value) {
            final normalized = value.trim();
            return normalized.isEmpty || normalized.length > 200 ? null : normalized;
          }
          """.replace('          ', ''))

          telemetry_test = 'apps/mosaic_app/test/play_resolution_telemetry_test.dart'
          ttext = Path(telemetry_test).read_text()
          replace_once(
              telemetry_test,
              """  test('invalid identities and impossible attempt counts fail before telemetry', () {
                final telemetry = _RecordingTelemetry();

                expect(
                  () => recordPlayResolutionTelemetry(
                    telemetry,
                    playId: ' ',
                    outcome: 'correct',
                    attempts: 1,
                    completed: true,
                  ),
                  throwsArgumentError,
                );
                expect(
                  () => recordPlayResolutionTelemetry(
                    telemetry,
                    playId: 'play',
                    outcome: 'correct',
                    attempts: 0,
                    completed: true,
                  ),
                  throwsArgumentError,
                );
                expect(telemetry.events, isEmpty);
              });
              """.replace('              ', ''),
              """  test('invalid identities and impossible attempt counts are dropped safely', () {
                final telemetry = _RecordingTelemetry();

                recordPlayResolutionTelemetry(
                  telemetry,
                  playId: ' ',
                  outcome: 'correct',
                  attempts: 1,
                  completed: true,
                );
                recordPlayResolutionTelemetry(
                  telemetry,
                  playId: 'play',
                  outcome: 'correct',
                  attempts: 0,
                  completed: true,
                );

                expect(telemetry.events, isEmpty);
              });
              """.replace('              ', ''),
          )

          # Preserve why a page advanced. Only a direct user page gesture is
          # allowed to become the implicit `swipe` ranking signal.
          feed = 'apps/mosaic_app/lib/consumer_feed.dart'
          replace_once(
              feed,
              """final class ConsumerFeedController {
                Future<bool> Function()? _advance;
                bool get attached => _advance != null;
                Future<bool> advance() async {
                  final callback = _advance;
                  return callback == null ? false : callback();
                }

                void _attach(Future<bool> Function() callback) => _advance = callback;
                void _detach(Future<bool> Function() callback) {
                  if (identical(_advance, callback)) _advance = null;
                }
              }
              """.replace('              ', ''),
              """enum ConsumerFeedAdvanceReason {
                notInterested('not_interested'),
                topicMuted('topic_muted'),
                reported('reported');

                const ConsumerFeedAdvanceReason(this.wireName);
                final String wireName;
              }

              final class ConsumerFeedController {
                Future<bool> Function(ConsumerFeedAdvanceReason reason)? _advance;
                bool get attached => _advance != null;

                Future<bool> advance(ConsumerFeedAdvanceReason reason) async {
                  final callback = _advance;
                  return callback == null ? false : callback(reason);
                }

                void _attach(
                  Future<bool> Function(ConsumerFeedAdvanceReason reason) callback,
                ) => _advance = callback;

                void _detach(
                  Future<bool> Function(ConsumerFeedAdvanceReason reason) callback,
                ) {
                  if (identical(_advance, callback)) _advance = null;
                }
              }
              """.replace('              ', ''),
          )
          replace_once(
              feed,
              '  bool _directManipulationActive = false;\n',
              """  bool _directManipulationActive = false;
                String? _pendingAdvanceIdentity;
                ConsumerFeedAdvanceReason? _pendingAdvanceReason;
              """.replace('              ', ''),
          )
          replace_once(
              feed,
              """  Future<bool> _requestAdvance() async {
                if (!mounted || _entries.isEmpty || _directManipulationActive) {
                  return false;
                }
                final currentIdentity = _entries[_currentIndex].analyticsIdentity;
                Future<bool> advanceLoaded() async {
                  if (!mounted ||
                      _entries.isEmpty ||
                      _currentIndex >= _entries.length ||
                      _entries[_currentIndex].analyticsIdentity != currentIdentity ||
                      _currentIndex + 1 >= _entries.length) {
                    return false;
                  }
                  await _pageController.nextPage(
                    duration: const Duration(milliseconds: 180),
                    curve: Curves.easeOutCubic,
                  );
                  return true;
                }

                if (await advanceLoaded()) return true;
                final cursor = _nextCursor;
                if (cursor == null || _fetching) return false;
                await _fetchPage(cursor, epoch: _loadEpoch);
                return advanceLoaded();
              }
              """.replace('              ', ''),
              """  Future<bool> _requestAdvance(ConsumerFeedAdvanceReason reason) async {
                if (!mounted || _entries.isEmpty || _directManipulationActive) {
                  return false;
                }
                final currentIdentity = _entries[_currentIndex].analyticsIdentity;
                Future<bool> advanceLoaded() async {
                  if (!mounted ||
                      _entries.isEmpty ||
                      _currentIndex >= _entries.length ||
                      _entries[_currentIndex].analyticsIdentity != currentIdentity ||
                      _currentIndex + 1 >= _entries.length) {
                    return false;
                  }
                  _pendingAdvanceIdentity = currentIdentity;
                  _pendingAdvanceReason = reason;
                  try {
                    await _pageController.nextPage(
                      duration: const Duration(milliseconds: 180),
                      curve: Curves.easeOutCubic,
                    );
                  } finally {
                    if (_pendingAdvanceIdentity == currentIdentity) {
                      _pendingAdvanceIdentity = null;
                      _pendingAdvanceReason = null;
                    }
                  }
                  return true;
                }

                if (await advanceLoaded()) return true;
                final cursor = _nextCursor;
                if (cursor == null || _fetching) return false;
                await _fetchPage(cursor, epoch: _loadEpoch);
                return advanceLoaded();
              }
              """.replace('              ', ''),
          )
          replace_once(
              feed,
              """    setState(() {
                _currentIndex = index;
                _directManipulationActive = false;
                _trimRetainedWindow();
              });

              _emitDismissed(previous);
              """.replace('              ', ''),
              """    final programmaticReason =
                  _pendingAdvanceIdentity == previous.analyticsIdentity
                  ? _pendingAdvanceReason
                  : null;
              _pendingAdvanceIdentity = null;
              _pendingAdvanceReason = null;

              setState(() {
                _currentIndex = index;
                _directManipulationActive = false;
                _trimRetainedWindow();
              });

              _emitDismissed(
                previous,
                reason: programmaticReason?.wireName ?? 'swipe',
              );
              """.replace('              ', ''),
          )
          replace_once(
              feed,
              """  void _emitDismissed(_FeedEntry entry) {
                widget.onEvent?.call(
                  MosaicEventName.playDismissed,
                  feedRequestId: entry.requestId,
                  playRevisionId: entry.item.revisionId,
                  payload: <String, Object?>{
                    'playId': entry.item.playId,
                    'reason': 'swipe',
                  },
                );
              }
              """.replace('              ', ''),
              """  void _emitDismissed(_FeedEntry entry, {required String reason}) {
                widget.onEvent?.call(
                  MosaicEventName.playDismissed,
                  feedRequestId: entry.requestId,
                  playRevisionId: entry.item.revisionId,
                  payload: <String, Object?>{
                    'playId': entry.item.playId,
                    'reason': reason,
                  },
                );
              }
              """.replace('              ', ''),
          )

          controls = 'apps/mosaic_app/lib/consumer_action_controls.dart'
          replace_once(
              controls,
              "import 'consumer_api_client.dart';\n",
              "import 'consumer_api_client.dart';\nimport 'consumer_feed.dart';\n",
          )
          replace_once(
              controls,
              '  final Future<bool> Function() onAdvance;\n',
              '  final Future<bool> Function(ConsumerFeedAdvanceReason reason) onAdvance;\n',
          )
          replace_once(
              controls,
              '      if (applied) await widget.onAdvance();\n',
              """      if (applied) {
                await widget.onAdvance(ConsumerFeedAdvanceReason.notInterested);
              }
              """.replace('              ', ''),
          )
          replace_once(
              controls,
              '    if (applied && muted) await widget.onAdvance();\n',
              """    if (applied && muted) {
                await widget.onAdvance(ConsumerFeedAdvanceReason.topicMuted);
              }
              """.replace('              ', ''),
          )
          replace_once(
              controls,
              '    if (reported) await widget.onAdvance();\n',
              """    if (reported) {
                await widget.onAdvance(ConsumerFeedAdvanceReason.reported);
              }
              """.replace('              ', ''),
          )

          main = 'apps/mosaic_app/lib/main.dart'
          replace_once(
              main,
              "import 'onboarding_localizations.dart';\n",
              "import 'onboarding_localizations.dart';\nimport 'play_resolution_telemetry.dart';\n",
          )
          replace_once(
              main,
              """      play: item.play,
                mediaBuilder: media.call,
                onDirectManipulationChanged: onDirectManipulationChanged,
              );
              """.replace('              ', ''),
              """      play: item.play,
                mediaBuilder: media.call,
                onResolved: (resolution) => recordPlayResolutionTelemetry(
                  telemetry,
                  playId: item.playId,
                  outcome: resolution.outcome,
                  attempts: resolution.session.attempts,
                  completed: resolution.session.ended,
                  correct: resolution.wasCorrect,
                ),
                onDirectManipulationChanged: onDirectManipulationChanged,
              );
              """.replace('              ', ''),
          )

          controls_test = 'apps/mosaic_app/test/consumer_action_controls_test.dart'
          replace_once(
              controls_test,
              "import 'package:mosaic_app/consumer_local_state.dart';\n",
              "import 'package:mosaic_app/consumer_local_state.dart';\nimport 'package:mosaic_app/consumer_feed.dart';\n",
          )
          replace_once(
              controls_test,
              """  var eventId = 0;
                var advances = 0;

                Future<bool> advance() async {
                  advances += 1;
                  return true;
                }
              """.replace('              ', ''),
              """  var eventId = 0;
                var advances = 0;
                final advanceReasons = <ConsumerFeedAdvanceReason>[];

                Future<bool> advance(ConsumerFeedAdvanceReason reason) async {
                  advances += 1;
                  advanceReasons.add(reason);
                  return true;
                }
              """.replace('              ', ''),
          )
          replace_once(
              controls_test,
              '    expect(harness.advances, 1);\n  });\n\n  testWidgets(\'muting the current topic is durable and advances\'',
              """    expect(harness.advances, 1);
                expect(harness.advanceReasons, <ConsumerFeedAdvanceReason>[
                  ConsumerFeedAdvanceReason.notInterested,
                ]);
              });

              testWidgets('muting the current topic is durable and advances'""".replace('              ', ''),
          )
          replace_once(
