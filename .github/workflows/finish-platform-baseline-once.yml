name: finish-platform-baseline-once

on:
  push:
    branches: ['agent/m05-platform-lifecycle-20260827']
    paths:
      - '.github/workflows/finish-platform-baseline-once.yml'
      - 'tool/finish_platform_baseline.py.gz.b64'

concurrency:
  group: finish-platform-baseline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Apply hardened platform baseline
        run: |
          base64 --decode tool/finish_platform_baseline.py.gz.b64 | gzip --decompress > tool/finish_platform_baseline.py
          python3 tool/finish_platform_baseline.py
      - name: Normalize Dart formatting
        run: dart format apps/mosaic_app/lib packages/platform_contracts packages/platform_flutter
      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test platform contracts
        working-directory: packages/platform_contracts
        run: dart test
      - name: Test Flutter platform adapters
        working-directory: packages/platform_flutter
        run: flutter test
      - name: Test app shell
        working-directory: apps/mosaic_app
        run: flutter test
      - name: Verify clean patch and unchanged remote head
        run: |
          git diff --check
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - name: Commit and push validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(platform): harden lifecycle, media ownership and permission localization'
          git push origin HEAD:"$GITHUB_REF_NAME"
