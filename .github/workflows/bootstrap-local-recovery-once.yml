name: bootstrap-local-recovery-once

on:
  push:
    branches: ['agent/m05-local-recovery-20260827']
    paths:
      - '.github/workflows/bootstrap-local-recovery-once.yml'

permissions:
  contents: write
  issues: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for platform foundation merge
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            state=$(gh issue view 13 --repo pullsar/mosaic --json state --jq .state)
            if [[ "$state" == CLOSED ]]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Issue #13 did not close in time.' >&2
          exit 1
      - name: Checkout local recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m05-local-recovery-20260827
          fetch-depth: 0
      - name: Integrate current main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main -m 'chore(local): sync completed platform foundation'
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve, normalize, and validate local state
        run: |
          set -euo pipefail
          flutter pub get
          dart format packages/local_state
          dart analyze packages/local_state --fatal-infos
          (cd packages/local_state && dart test --reporter=expanded)
          git diff --check
      - name: Publish finalized branch state
        run: |
          set -euo pipefail
          rm -f .github/workflows/lock-local-state-once.yml
          git rm .github/workflows/bootstrap-local-recovery-once.yml
          mkdir -p .release-gates
          printf 'local-recovery-bootstrap-v1\n' > .release-gates/local-recovery-ready
          git add pubspec.lock packages/local_state .github/workflows .release-gates/local-recovery-ready
          if ! git diff --cached --quiet; then
            git commit -m 'chore(local): finalize durable recovery foundation'
          fi
          git push origin HEAD:agent/m05-local-recovery-20260827
