name: repair-local-recovery-release-once

on:
  push:
    branches: ['agent/m05-local-recovery-20260827']
    paths:
      - '.github/workflows/repair-local-recovery-release-once.yml'

permissions:
  contents: write
  issues: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for platform foundation and settle earlier bootstrap
        id: state
        run: |
          set -euo pipefail
          current=$(gh issue view 14 --repo pullsar/mosaic --json state --jq .state)
          echo "issue14=$current" >> "$GITHUB_OUTPUT"
          if [[ "$current" == CLOSED ]]; then
            exit 0
          fi
          for _ in $(seq 1 240); do
            state=$(gh issue view 13 --repo pullsar/mosaic --json state --jq .state)
            [[ "$state" == CLOSED ]] && break
            sleep 10
          done
          [[ "$state" == CLOSED ]]
          sleep 150
      - name: Checkout latest recovery head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m05-local-recovery-20260827
          fetch-depth: 0
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Reconcile current main, lock, and recovery behavior
        if: steps.state.outputs.issue14 != 'CLOSED'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main -m 'chore(local): sync completed platform foundation'
          flutter pub get
          dart format packages/local_state
          dart analyze packages/local_state --fatal-infos
          (cd packages/local_state && dart test --reporter=expanded)
          git diff --check
      - name: Remove stale gates and publish reconciled head
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            .github/workflows/bootstrap-local-recovery-once.yml \
            .github/workflows/lock-local-state-once.yml \
            .github/workflows/release-local-recovery-once.yml \
            .release-gates/local-recovery-ready \
            packages/local_state/.local-recovery-release-gate
          git rm .github/workflows/repair-local-recovery-release-once.yml
          git add pubspec.lock packages/local_state .github/workflows .release-gates 2>/dev/null || true
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'chore(local): reconcile durable recovery foundation'
            git push origin HEAD:agent/m05-local-recovery-20260827
          fi
