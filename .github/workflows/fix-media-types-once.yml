name: fix-media-types-once

on:
  push:
    branches: ['agent/m07-media-normalization-20260828']
    paths:
      - '.github/workflows/fix-media-types-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mosaic
          POSTGRES_USER: mosaic
          POSTGRES_PASSWORD: mosaic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mosaic -d mosaic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mosaic:mosaic@localhost:5432/mosaic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/m07-media-normalization-20260828
      - name: Widen claim token default type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/media_repository.ts')
          text = path.read_text()
          old = '    claimToken = randomUUID(),\n'
          new = '    claimToken: string = randomUUID(),\n'
          if text.count(old) != 1:
              raise SystemExit('expected claimToken signature exactly once')
          path.write_text(text.replace(old, new))
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/api
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: apps/api
        run: npm run typecheck
      - name: Unit and PostgreSQL integration tests
        working-directory: apps/api
        run: npm test
      - name: Build
        working-directory: apps/api
        run: npm run build
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-media-types-once.yml
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/media_repository.ts .github/workflows/fix-media-types-once.yml
          git commit -m 'fix(media): widen worker claim token type'
          git push origin HEAD:agent/m07-media-normalization-20260828
