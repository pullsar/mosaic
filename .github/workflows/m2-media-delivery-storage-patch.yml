name: m2-media-delivery-storage-patch

on:
  push:
    branches: ['agent/m2-managed-asset-delivery-20260829']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m2-managed-asset-delivery-20260829
      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Patch S3 range reader and API wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          s3 = Path('apps/api/src/media_s3_storage.ts')
          text = s3.read_text()
          import_anchor = "import type {\n  MediaObjectPutRequest,\n  MediaObjectStore,\n  MediaStoredObject,\n} from './media_object_store.js';\n"
          import_replacement = import_anchor + "import type {\n  MediaByteRange,\n  MediaDeliveryObjectInspection,\n} from './media_delivery.js';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('S3 import anchor mismatch')
          text = text.replace(import_anchor, import_replacement)

          method_anchor = "  async downloadVerifiedObject(request: S3VerifiedDownloadRequest): Promise<string> {"
          methods = '''  async inspect(
            storageKey: string,
            signal?: AbortSignal,
          ): Promise<MediaDeliveryObjectInspection | null> {
            const stored = await this.headObject(storageKey, signal);
            return stored === null
              ? null
              : {sizeBytes: stored.sizeBytes, mimeType: stored.mimeType};
          }

          async openRange(
            storageKey: string,
            range: MediaByteRange,
            signal?: AbortSignal,
          ): Promise<Readable> {
            const key = normalizeStorageKey(storageKey);
            if (
              !Number.isSafeInteger(range.start) ||
              !Number.isSafeInteger(range.endInclusive) ||
              range.start < 0 ||
              range.endInclusive < range.start
            ) {
              throw new TypeError('S3 media delivery range must be a valid inclusive byte range');
            }
            abortIfRequested(signal);
            const url = this.objectUrl(key);
            const requestSignal = this.requestSignal(signal);
            const rangeHeader = `bytes=${range.start}-${range.endInclusive}`;
            const signed = this.sign('GET', url, EMPTY_SHA256, {range: rangeHeader});
            const response = await this.fetcher(url, {
              method: 'GET',
              headers: requestHeaders(signed),
              signal: requestSignal,
            });
            if (response.status !== 206 || response.body === null) {
              await discardBody(response);
              throw new S3MediaStorageError(
                `S3 ranged GET ${key} failed with HTTP ${response.status}`,
              );
            }
            const expectedLength = range.endInclusive - range.start + 1;
            const actualLength = requiredContentLength(response.headers, key);
            if (actualLength !== expectedLength) {
              await discardBody(response);
              throw new S3MediaStorageError(
                `S3 ranged GET ${key} length ${actualLength} != ${expectedLength}`,
              );
            }
            assertContentRange(response.headers, key, range);
            requiredMimeType(response.headers, key);
            return Readable.fromWeb(response.body as ReadableStream<Uint8Array>);
          }

'''
          if text.count(method_anchor) != 1:
              raise SystemExit('S3 method anchor mismatch')
          text = text.replace(method_anchor, methods + method_anchor)

          helper_anchor = "function requiredMimeType(headers: Headers, storageKey: string): string {"
          helper = '''function assertContentRange(
            headers: Headers,
            storageKey: string,
            range: MediaByteRange,
          ): void {
            const raw = headers.get('content-range');
            const match = raw === null ? null : /^bytes (\\d+)-(\\d+)\\/(\\d+)$/.exec(raw);
            if (match === null) {
              throw new S3MediaStorageError(
                `S3 ranged object ${storageKey} has no valid Content-Range`,
              );
            }
            const start = Number(match[1]);
            const endInclusive = Number(match[2]);
            const total = Number(match[3]);
            if (
              !Number.isSafeInteger(start) ||
              !Number.isSafeInteger(endInclusive) ||
              !Number.isSafeInteger(total) ||
              start !== range.start ||
              endInclusive !== range.endInclusive ||
              total <= endInclusive
            ) {
              throw new S3MediaStorageError(
                `S3 ranged object ${storageKey} returned an unexpected Content-Range`,
              );
            }
          }

'''
          if text.count(helper_anchor) != 1:
              raise SystemExit('S3 helper anchor mismatch')
          s3.write_text(text.replace(helper_anchor, helper + helper_anchor))

          server = Path('apps/api/src/server.ts')
          text = server.read_text()
          imports = "import {loadConfig} from './config.js';\n"
          imports_replacement = imports + "import {loadMediaDeliveryStorageConfig} from './media_delivery_config.js';\nimport {MediaDeliveryService} from './media_delivery.js';\nimport {LocalMediaDeliveryObjectReader} from './media_delivery_local_storage.js';\nimport {registerMediaDeliveryRoutes} from './media_delivery_routes.js';\nimport {PostgresMediaPublicationGate} from './media_publication.js';\nimport {S3CompatibleMediaStorage} from './media_s3_storage.js';\n"
          if text.count(imports) != 1:
              raise SystemExit('server imports anchor mismatch')
          text = text.replace(imports, imports_replacement)
          app_anchor = '''const app = buildApp({
            repository,
            consumerRepository,
            logLevel: config.logLevel,
            allowedWebOrigins: config.allowedWebOrigins,
          });
'''
          app_replacement = app_anchor + '''
          const mediaDeliveryConfig = loadMediaDeliveryStorageConfig();
          if (mediaDeliveryConfig.storageMode !== 'disabled') {
            const publication = new PostgresMediaPublicationGate(pool);
            const reader = mediaDeliveryConfig.storageMode === 'local'
              ? new LocalMediaDeliveryObjectReader(mediaDeliveryConfig.objectRoot)
              : new S3CompatibleMediaStorage({
                  endpoint: mediaDeliveryConfig.s3Endpoint,
                  bucket: mediaDeliveryConfig.s3Bucket,
                  region: mediaDeliveryConfig.s3Region,
                  accessKeyId: mediaDeliveryConfig.s3AccessKeyId,
                  secretAccessKey: mediaDeliveryConfig.s3SecretAccessKey,
                  ...(mediaDeliveryConfig.s3SessionToken === undefined
                    ? {}
                    : {sessionToken: mediaDeliveryConfig.s3SessionToken}),
                  requestTimeoutMs: mediaDeliveryConfig.storageTimeoutMs,
                });
            registerMediaDeliveryRoutes(
              app,
              new MediaDeliveryService(publication, reader),
            );
          }
'''
          if text.count(app_anchor) != 1:
              raise SystemExit('server app anchor mismatch')
          server.write_text(text.replace(app_anchor, app_replacement))

          app = Path('apps/api/src/app.ts')
          text = app.read_text()
          cors_anchor = "const CORS_METHODS = 'GET,POST,PUT,OPTIONS';\nconst CORS_HEADERS = 'content-type,authorization';"
          cors_replacement = "const CORS_METHODS = 'GET,HEAD,POST,PUT,OPTIONS';\nconst CORS_HEADERS = 'content-type,authorization,range';\nconst CORS_EXPOSE_HEADERS = 'accept-ranges,content-length,content-range';"
          if text.count(cors_anchor) != 1:
              raise SystemExit('CORS constants anchor mismatch')
          text = text.replace(cors_anchor, cors_replacement)
          hook_anchor = "    reply.header('access-control-allow-headers', CORS_HEADERS);\n    reply.header('access-control-max-age', '600');"
          hook_replacement = "    reply.header('access-control-allow-headers', CORS_HEADERS);\n    reply.header('access-control-expose-headers', CORS_EXPOSE_HEADERS);\n    reply.header('access-control-max-age', '600');"
          if text.count(hook_anchor) != 1:
              raise SystemExit('CORS hook anchor mismatch')
          app.write_text(text.replace(hook_anchor, hook_replacement))

          app_test = Path('apps/api/test/app.test.ts')
          text = app_test.read_text()
          text = text.replace(
            "assert.equal(preflight.headers['access-control-allow-methods'], 'GET,POST,PUT,OPTIONS');",
            "assert.equal(preflight.headers['access-control-allow-methods'], 'GET,HEAD,POST,PUT,OPTIONS');",
          )
          text = text.replace(
            "assert.equal(preflight.headers['access-control-allow-headers'], 'content-type,authorization');",
            "assert.equal(preflight.headers['access-control-allow-headers'], 'content-type,authorization,range');\n  assert.equal(\n    preflight.headers['access-control-expose-headers'],\n    'accept-ranges,content-length,content-range',\n  );",
          )
          app_test.write_text(text)

          s3_test = Path('apps/api/test/media_s3_storage.test.ts')
          text = s3_test.read_text()
          append = '''

test('S3 delivery reader verifies HEAD metadata and streams an exact signed byte range', async () => {
  const bytes = Buffer.from('0123456789');
  const sha256 = digest(bytes);
  const methods: string[] = [];
  const store = storage(async (_input, init) => {
    const method = init?.method ?? 'GET';
    methods.push(method);
    if (method === 'HEAD') {
      return new Response(null, {
        status: 200,
        headers: {
          'content-length': String(bytes.length),
          'content-type': 'video/mp4',
          'x-amz-meta-mosaic-sha256': sha256,
        },
      });
    }
    assert.equal(method, 'GET');
    assert.equal(headers(init).get('range'), 'bytes=2-5');
    assert.match(headers(init).get('authorization') ?? '', /^AWS4-HMAC-SHA256 /);
    return new Response(bytes.subarray(2, 6), {
      status: 206,
      headers: {
        'content-length': '4',
        'content-range': 'bytes 2-5/10',
        'content-type': 'video/mp4',
      },
    });
  });

  assert.deepEqual(await store.inspect('media/asset/video.mp4'), {
    sizeBytes: 10,
    mimeType: 'video/mp4',
  });
  const stream = await store.openRange(
    'media/asset/video.mp4',
    {start: 2, endInclusive: 5},
  );
  const chunks: Buffer[] = [];
  for await (const chunk of stream) chunks.push(Buffer.from(chunk));
  assert.equal(Buffer.concat(chunks).toString('utf8'), '2345');
  assert.deepEqual(methods, ['HEAD', 'GET']);
});

test('S3 delivery reader rejects non-partial or inconsistent range responses', async () => {
  const badStatus = storage(async () =>
    new Response(Buffer.from('0123'), {
      status: 200,
      headers: {'content-length': '4', 'content-type': 'video/mp4'},
    }),
  );
  await assert.rejects(
    badStatus.openRange('media/asset/video.mp4', {start: 0, endInclusive: 3}),
    /ranged GET.*HTTP 200/,
  );

  const badRange = storage(async () =>
    new Response(Buffer.from('0123'), {
      status: 206,
      headers: {
        'content-length': '4',
        'content-range': 'bytes 1-4/10',
        'content-type': 'video/mp4',
      },
    }),
  );
  await assert.rejects(
    badRange.openRange('media/asset/video.mp4', {start: 0, endInclusive: 3}),
    /unexpected Content-Range/,
  );
});
'''
          if 'S3 delivery reader verifies HEAD metadata' in text:
              raise SystemExit('S3 delivery tests already inserted')
          s3_test.write_text(text.rstrip() + append)

          env = Path('apps/api/.env.example')
          text = env.read_text()
          env_anchor = 'MOSAIC_WEB_ORIGINS=\n\n'
          env_replacement = '''MOSAIC_WEB_ORIGINS=

# Consumer delivery is disabled until explicitly configured on the API process.
# Local mode reads only the immutable derivative object root; S3 mode reuses
# the private MEDIA_S3_* identity below and never exposes storage keys.
MEDIA_DELIVERY_STORAGE_MODE=disabled
MEDIA_DELIVERY_STORAGE_TIMEOUT_MS=60000
# MEDIA_DELIVERY_OBJECT_ROOT=/srv/mosaic/objects

'''
          if text.count(env_anchor) != 1:
              raise SystemExit('env delivery anchor mismatch')
          env.write_text(text.replace(env_anchor, env_replacement))
          PY

          cd apps/api
          npm ci
          npm run typecheck
          npm test
          npm run build

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts src/app.ts src/media_s3_storage.ts \
                  test/app.test.ts test/media_s3_storage.test.ts .env.example
          git commit -m 'feat(m2): wire private media storage delivery'
          git push origin HEAD:agent/m2-managed-asset-delivery-20260829
