name: harden-audio-suspend

on:
  push:
    branches: [agent/m06-play-renderer-20260828]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/m06-play-renderer-20260828
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python3 .github/scripts/harden_audio_suspend.py
      - run: dart format packages/play_flutter/lib/src/play_audio_renderer.dart packages/play_flutter/test/play_audio_renderer_test.dart
      - run: flutter analyze
      - run: flutter test
        working-directory: packages/play_flutter
      - run: git rm .github/workflows/harden-audio-suspend-once.yml .github/scripts/harden_audio_suspend.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/play_flutter
          git commit -am "fix(renderer): fence audio playback across lifecycle suspension"
          git push origin HEAD:agent/m06-play-renderer-20260828
