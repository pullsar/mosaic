name: agent-m2-ranking-apply2

on:
  push:
    branches: ['agent/m2-ranking-signals-20260830']
    paths: ['.github/workflows/agent-m2-ranking-apply2.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mosaic
          POSTGRES_USER: mosaic
          POSTGRES_PASSWORD: mosaic
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mosaic -d mosaic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mosaic:mosaic@localhost:5432/mosaic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m2-ranking-signals-20260830
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Build current-source product patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/agent-m2-ranking-finalize.yml').read_text()
          start_marker = '      - name: Apply final ranking-signal changes\n        run: |\n'
          end_marker = '      - name: Validate API and targeted Flutter surface\n'
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = dedent(source[start:end]).rstrip() + '\n'

          # The original recipe predates several permanent partial refactors.
          # Replace stale sections against the actual branch source.
          sql_pos = script.index('"""      where event.actor_id = $1')
          sql_start = script.rfind('replace_once(', 0, sql_pos)
          sql_end = script.index('\n\n# Migration 008', sql_pos)
          sql_replacement = '''projector_path = Path(projector)
          projector_text = projector_path.read_text()
          projection_where = "      where event.actor_id = $1\\n        and (\\n"
          if projector_text.count(projection_where) != 1:
              raise SystemExit('consumer_signal_projector.ts: projection WHERE shape changed')
          projector_path.write_text(projector_text.replace(
              projection_where,
              "      where event.actor_id = $1\\n        and event.event_name in ('play_visible', 'play_resolved', 'play_dismissed')\\n        and (\\n",
              1,
          ))'''.replace('          ', '')
          script = script[:sql_start] + sql_replacement + script[sql_end:]

          migration_pos = script.index('const actionsDownPool = new Pool')
          migration_start = script.rfind('replace_once(', 0, migration_pos)
          migration_end = script.index('\n\n# Projector regression', migration_pos)
          migration_replacement = '''postgres_path = Path(postgres_test)
          postgres_text = postgres_path.read_text()
          anchor = "  await runMigration('down');\\n  const actionsDownPool = new Pool({connectionString: databaseUrl});\\n"
          if postgres_text.count(anchor) != 1:
              raise SystemExit('postgres.test.ts: migration rollback anchor changed')
          insert = """  await runMigration('down');
          const profileDownPool = new Pool({connectionString: databaseUrl});
          try {
            const afterProfileDown = await profileDownPool.query<{
              consumer_signal_profiles: string | null;
              actor_topic_mutes: string | null;
            }>(
              `select to_regclass('public.consumer_signal_profiles')::text as consumer_signal_profiles,
                      to_regclass('public.actor_topic_mutes')::text as actor_topic_mutes`,
            );
            assert.equal(afterProfileDown.rows[0]?.consumer_signal_profiles, null);
            assert.equal(afterProfileDown.rows[0]?.actor_topic_mutes, 'actor_topic_mutes');
          } finally {
            await profileDownPool.end();
          }

          await runMigration('down');
          const actionsDownPool = new Pool({connectionString: databaseUrl});
          """.replace('          ', '')
          postgres_path.write_text(postgres_text.replace(anchor, insert, 1))'''.replace('          ', '')
          script = script[:migration_start] + migration_replacement + script[migration_end:]

          projection_start = script.index('# Projector regression expectations')
          projection_end = script.index('# Feed-level regressions', projection_start)
          projection_replacement = '''# Projector regression expectations against current source.
          projection_test = Path('apps/api/test/consumer_signal_projector_postgres.test.ts')
          projection_text = projection_test.read_text()
          sequence = """      assert.equal(await projector.projectActor(actorId), 2);
                assert.equal(await projector.projectActor(actorId), 2);
                assert.equal(await projector.projectActor(actorId), 0);
          """.replace('          ', '')
          if projection_text.count(sequence) != 1:
              raise SystemExit('projector test: initial batch sequence changed')
          projection_text = projection_text.replace(
              sequence,
              "      assert.equal(await projector.projectActor(actorId), 2);\\n      assert.equal(await projector.projectActor(actorId), 0);\\n",
              1,
          )
          concurrent_old = '      assert.equal(concurrent.reduce((sum, value) => sum + value, 0), 1);\\n'
          if projection_text.count(concurrent_old) != 1:
              raise SystemExit('projector test: concurrent expectation changed')
          projection_text = projection_text.replace(
              concurrent_old,
              '      assert.equal(concurrent.reduce((sum, value) => sum + value, 0), 0);\\n',
              1,
          )
          duplicate_call = "      assert.equal(await events.insertEvent(duplicateIntent), 'inserted');\\n      assert.equal(await projector.projectActor(actorId), 1);\\n"
          if projection_text.count(duplicate_call) != 1:
              raise SystemExit('projector test: duplicate intent expectation changed')
          projection_text = projection_text.replace(
              duplicate_call,
              "      assert.equal(await events.insertEvent(duplicateIntent), 'inserted');\\n      assert.equal(await projector.projectActor(actorId), 0);\\n",
              1,
          )
          rebuild = """      assert.equal(bounded?.formatDismissalCounts.choose, 2);

                const beforeRebuild = await rawProjection(pool, actorId);
                const rebuiltEvents = await projector.rebuildActor(actorId);
                assert.ok(rebuiltEvents >= 5);
          """.replace('          ', '')
          if projection_text.count(rebuild) != 1:
              raise SystemExit('projector test: rebuild anchor changed')
          decay = """      assert.equal(bounded?.formatDismissalCounts.choose, 2);

                const clockAnchor = Date.now();
                const afterMoreLikeExpiry = await new PostgresConsumerSignalProjector(pool, {
                  clock: () => new Date(clockAnchor + 15 * 24 * 60 * 60 * 1000),
                }).readActorProfile(actorId);
                assert.deepEqual(afterMoreLikeExpiry?.moreLikeTopicIds, []);
                assert.equal(afterMoreLikeExpiry?.topicDismissalCounts[artTopic], 2);

                const afterDismissalExpiry = await new PostgresConsumerSignalProjector(pool, {
                  clock: () => new Date(clockAnchor + 31 * 24 * 60 * 60 * 1000),
                }).readActorProfile(actorId);
                assert.deepEqual(afterDismissalExpiry?.topicDismissalCounts, {});
                assert.deepEqual(afterDismissalExpiry?.formatDismissalCounts, {});
                assert.ok((afterDismissalExpiry?.interactionAffinity.guess ?? 0) > 0);

                const afterAffinityExpiry = await new PostgresConsumerSignalProjector(pool, {
                  clock: () => new Date(clockAnchor + 91 * 24 * 60 * 60 * 1000),
                }).readActorProfile(actorId);
                assert.deepEqual(afterAffinityExpiry?.interactionAffinity, {});
                assert.deepEqual(afterAffinityExpiry?.recentPlayRevisionKeys, []);

                const beforeRebuild = await rawProjection(pool, actorId);
                const rebuiltEvents = await projector.rebuildActor(actorId);
                assert.equal(rebuiltEvents, 2);
          """.replace('          ', '')
          projection_test.write_text(projection_text.replace(rebuild, decay, 1))

          '''.replace('          ', '')
          script = script[:projection_start] + projection_replacement + script[projection_end:]

          # Resolution telemetry and its safe-drop regression are already
          # committed directly to the branch; skip the stale recipe copy.
          telemetry_start = script.index('# Client telemetry must never destabilize Play execution.')
          reasons_start = script.index('# Preserve why a page advanced.', telemetry_start)
          script = script[:telemetry_start] + script[reasons_start:]

          Path('/tmp/apply-ranking-current.sh').write_text(script)
          PY
          bash -e /tmp/apply-ranking-current.sh
      - name: Validate product changes
        run: |
          npm --prefix apps/api ci --ignore-scripts
          npm --prefix apps/api run typecheck
          npm --prefix apps/api test
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test apps/mosaic_app/test/play_resolution_telemetry_test.dart
          flutter test apps/mosaic_app/test/consumer_action_controls_test.dart
          flutter test apps/mosaic_app/test/consumer_feed_test.dart
      - name: Commit product files only
        run: |
          git config user.name xwiz
          git config user.email c.opata@robosyslive.com
          git add apps/api apps/mosaic_app
          git diff --cached --check
          git diff --cached --quiet && { echo 'No product changes staged'; exit 1; }
          git commit -m 'feat(m2): complete live ranking signal loop'
          git push origin HEAD:agent/m2-ranking-signals-20260830
