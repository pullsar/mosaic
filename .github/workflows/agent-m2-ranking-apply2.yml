name: agent-m2-ranking-apply2

on:
  push:
    branches: ['agent/m2-ranking-signals-20260830']
    paths: ['.github/workflows/agent-m2-ranking-apply2.yml']

concurrency:
  group: agent-m2-ranking-finalizer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mosaic
          POSTGRES_USER: mosaic
          POSTGRES_PASSWORD: mosaic
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mosaic -d mosaic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://mosaic:mosaic@localhost:5432/mosaic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m2-ranking-signals-20260830
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Apply source-aware product finalizer
        run: |
          python3 tools/agent_m2_finalize.py
          python3 - <<'PY'
          from pathlib import Path

          controls = Path('apps/mosaic_app/test/consumer_action_controls_test.dart')
          text = controls.read_text()
          old = "import 'package:mosaic_app/consumer_local_state.dart';\nimport 'package:mosaic_app/consumer_feed.dart';\n"
          new = "import 'package:mosaic_app/consumer_feed.dart';\nimport 'package:mosaic_app/consumer_local_state.dart';\n"
          if old not in text:
              raise SystemExit('consumer_action_controls_test.dart: generated import shape changed')
          controls.write_text(text.replace(old, new, 1))

          feed_test = Path('apps/mosaic_app/test/consumer_feed_test.dart')
          text = feed_test.read_text()
          analytics_import = "import 'package:analytics_contract/analytics_contract.dart';\n"
          if analytics_import not in text:
              marker = "import 'package:event_delivery/event_delivery.dart';\n"
              if text.count(marker) != 1:
                  raise SystemExit('consumer_feed_test.dart: import marker changed')
              text = text.replace(marker, analytics_import + marker, 1)
          blocked = "    expect(\n      await controller.advance(ConsumerFeedAdvanceReason.notInterested),\n      isTrue,\n    );\n    await tester.pumpAndSettle();\n"
          driven = "    final advance = controller.advance(\n      ConsumerFeedAdvanceReason.notInterested,\n    );\n    await tester.pumpAndSettle();\n    expect(await advance, isTrue);\n"
          if text.count(blocked) != 1:
              raise SystemExit('consumer_feed_test.dart: programmatic advance regression shape changed')
          feed_test.write_text(text.replace(blocked, driven, 1))

          telemetry_test = Path('apps/mosaic_app/test/play_resolution_telemetry_test.dart')
          text = telemetry_test.read_text()
          if "import 'dart:async';\n" not in text:
              text = "import 'dart:async';\n\n" + text
          if 'void error(Object error, StackTrace stackTrace, {String? operation})' not in text:
              marker = "  void event(String name, Map<String, Object?> payload) {\n    events.add((name: name, payload: Map<String, Object?>.of(payload)));\n  }\n"
              if text.count(marker) != 1:
                  raise SystemExit('play_resolution_telemetry_test.dart: event fake shape changed')
              addition = marker + "\n  @override\n  void error(Object error, StackTrace stackTrace, {String? operation}) {}\n\n  @override\n  FutureOr<T> trace<T>(String operation, FutureOr<T> Function() body) => body();\n"
              text = text.replace(marker, addition, 1)
          telemetry_test.write_text(text)
          PY
          dart format apps/mosaic_app/lib apps/mosaic_app/test
      - name: Validate API and PostgreSQL behavior
        run: |
          npm --prefix apps/api ci --ignore-scripts
          npm --prefix apps/api run typecheck
          npm --prefix apps/api test
      - name: Validate Flutter surface
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          timeout 120s flutter test apps/mosaic_app/test/play_resolution_telemetry_test.dart
          timeout 120s flutter test apps/mosaic_app/test/consumer_action_controls_test.dart
          timeout 120s flutter test apps/mosaic_app/test/consumer_feed_test.dart
      - name: Commit product files only
        run: |
          git config user.name xwiz
          git config user.email c.opata@robosyslive.com
          git add apps/api apps/mosaic_app
          git diff --cached --check
          git diff --cached --quiet && { echo 'No product changes staged'; exit 1; }
          git commit -m 'feat(m2): complete live ranking signal loop'
          git push origin HEAD:agent/m2-ranking-signals-20260830
