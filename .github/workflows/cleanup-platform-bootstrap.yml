name: cleanup-platform-bootstrap-once

on:
  push:
    branches: ['agent/m05-platform-lifecycle-20260827']
    paths:
      - '.github/workflows/cleanup-platform-bootstrap.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove one-time workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/bootstrap-flutter-hosts.yml \
            .github/workflows/cleanup-platform-bootstrap.yml
          git commit -m 'chore(platform): remove one-time bootstrap workflows'
          git push
