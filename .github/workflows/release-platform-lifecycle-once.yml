name: release-platform-lifecycle-once

on:
  push:
    branches: ['agent/m05-platform-lifecycle-20260827']
    paths:
      - '.github/workflows/release-platform-lifecycle-once.yml'

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge-after-exact-head-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: pullsar/mosaic
      BRANCH: agent/m05-platform-lifecycle-20260827
      MARKER: apps/mosaic_app/.platform-release-gate
    steps:
      - name: Wait for the connector-authored exact-head marker
        id: target
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            target=$(gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
            if gh api "repos/$REPOSITORY/contents/$MARKER?ref=$BRANCH" >/dev/null 2>&1; then
              echo "sha=$target" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo 'Exact-head marker was not published in time.' >&2
          exit 1

      - name: Wait for repository and native build gates
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            current=$(gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
            if [[ "$current" != "$TARGET_SHA" ]]; then
              echo "Branch moved while validating: expected $TARGET_SHA, found $current" >&2
              exit 1
            fi
            runs=$(gh api -X GET "repos/$REPOSITORY/actions/runs" -f head_sha="$TARGET_SHA" -f per_page=100)
            platform=$(jq -r '[.workflow_runs[] | select(.name == "platform-ci")] | sort_by(.created_at) | last | if . == null then "missing:" else "\(.status):\(.conclusion // "")" end' <<<"$runs")
            repository=$(jq -r '[.workflow_runs[] | select(.name == "ci")] | sort_by(.created_at) | last | if . == null then "missing:" else "\(.status):\(.conclusion // "")" end' <<<"$runs")
            echo "platform-ci=$platform ci=$repository"
            for state in "$platform" "$repository"; do
              status=${state%%:*}
              conclusion=${state#*:}
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                echo "Required gate failed: $state" >&2
                exit 1
              fi
            done
            if [[ "$platform" == completed:success && "$repository" == completed:success ]]; then
              exit 0
            fi
            sleep 20
          done
          echo 'Timed out waiting for exact-head gates.' >&2
          exit 1

      - name: Remove temporary gate files and merge the validated branch
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repository
          cd repository
          git checkout "$BRANCH"
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git merge-base --is-ancestor origin/main HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm ".github/workflows/release-platform-lifecycle-once.yml" "$MARKER"
          git commit -m 'chore(platform): remove temporary release gate'
          git push origin "$BRANCH"

          pr=$(gh pr list --repo "$REPOSITORY" --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            url=$(gh pr create \
              --repo "$REPOSITORY" \
              --head "$BRANCH" \
              --base main \
              --title 'feat(platform): complete lifecycle and native host foundation' \
              --body $'Closes #13\n\nCompletes the mobile/web platform foundation with generated native hosts, serialized single-active-Play media ownership, ordered lifecycle suspension/recovery, contextual camera/microphone/notification permissions, scoped system media picking with Android lost-data recovery, minimized manifests, iOS privacy declarations and localized purpose strings, reserved privacy/support/delete-account routes, and real Android/web/iOS build validation.\n\nThe exact code-bearing parent passed repository CI plus platform contract/adapter/app tests and Android, web, and iOS simulator builds. The final child removes only this temporary release workflow and marker.' )
            pr=${url##*/}
          fi
          for _ in $(seq 1 24); do
            mergeable=$(gh pr view "$pr" --repo "$REPOSITORY" --json mergeable --jq .mergeable)
            [[ "$mergeable" != UNKNOWN ]] && break
            sleep 5
          done
          [[ "$mergeable" == MERGEABLE ]]
          gh pr merge "$pr" --repo "$REPOSITORY" --merge --delete-branch=false
