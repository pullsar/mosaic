name: deploy-production

on:
  push:
    branches: [main]

concurrency:
  group: mixli-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Install restricted deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.MIXLI_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOST: ${{ secrets.MIXLI_DEPLOY_KNOWN_HOST }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/mixli-deploy"
          install -m 0600 /dev/null "$HOME/.ssh/known_hosts"
          write_ssh_file() {
            local path="$1"
            local value="$2"
            value="${value//\\r/}"
            value="${value//$'\r'/}"
            value="${value//\\n/$'\n'}"
            printf '%s' "$value" >"$path"
            [[ "$value" == *$'\n' ]] || printf '\n' >>"$path"
          }
          write_ssh_file "$HOME/.ssh/mixli-deploy" "$DEPLOY_KEY"
          ssh-keygen -y -f "$HOME/.ssh/mixli-deploy" >/dev/null
          write_ssh_file "$HOME/.ssh/known_hosts" "$DEPLOY_KNOWN_HOST"
      - name: Trigger exact-SHA deployment
        run: >-
          ssh -i "$HOME/.ssh/mixli-deploy"
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          mixli-deploy@152.53.55.38 "deploy ${GITHUB_SHA}"
