name: lock-flutter-platform-once

on:
  push:
    branches: ['agent/m05-platform-lifecycle-20260827']
    paths:
      - '.github/workflows/bootstrap-flutter-hosts.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve and commit workspace lock
        run: |
          flutter pub get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet pubspec.lock; then
            git add pubspec.lock
            git commit -m 'chore(platform): lock Flutter dependencies'
            git push
          fi
