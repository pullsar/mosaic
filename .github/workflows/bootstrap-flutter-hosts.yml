name: normalize-platform-dart-once

on:
  push:
    branches: ['agent/m05-platform-lifecycle-20260827']
    paths:
      - '.github/workflows/bootstrap-flutter-hosts.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Format and commit
        run: |
          dart format apps/mosaic_app/lib packages/platform_contracts packages/platform_flutter
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add apps/mosaic_app/lib packages/platform_contracts packages/platform_flutter
            git commit -m 'style(platform): normalize Dart formatting'
            git push
          fi
