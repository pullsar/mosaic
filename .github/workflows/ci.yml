name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile
      - name: Show exact formatter diff
        run: |
          dart format .
          git diff -- apps/mosaic_app/lib/app_event_runtime.dart apps/mosaic_app/lib/consumer_api_client.dart apps/mosaic_app/lib/main.dart apps/mosaic_app/test/app_event_runtime_test.dart apps/mosaic_app/test/consumer_api_client_test.dart packages/event_delivery/lib/src/api_http_policy.dart packages/event_delivery/test/api_http_policy_test.dart
          exit 1
