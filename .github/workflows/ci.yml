name: ci

on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Format runtime files
        run: |
          dart format apps/mosaic_app/lib/consumer_runtime.dart apps/mosaic_app/test/consumer_runtime_test.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mosaic_app/lib/consumer_runtime.dart apps/mosaic_app/test/consumer_runtime_test.dart
          git diff --cached --quiet && exit 0
          git commit -m 'style: format consumer runtime tranche [skip ci]'
          git push origin HEAD:${{ github.ref_name }}
