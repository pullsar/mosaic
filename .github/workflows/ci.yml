name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files exactly
        run: |
          dart format \
            apps/mosaic_app/lib/event_runtime_resources.dart \
            packages/event_delivery/lib/src/http_event_transport.dart \
            packages/event_delivery/test/http_event_transport_test.dart \
            packages/event_delivery/test_web/indexed_db_actor_access_web_test.dart \
            packages/local_state/lib/local_state.dart \
            packages/local_state/test/actor_access_test.dart
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/mosaic_app/lib/event_runtime_resources.dart \
            packages/event_delivery/lib/src/http_event_transport.dart \
            packages/event_delivery/test/http_event_transport_test.dart \
            packages/event_delivery/test_web/indexed_db_actor_access_web_test.dart \
            packages/local_state/lib/local_state.dart \
            packages/local_state/test/actor_access_test.dart
          git commit -m 'style(actor): apply Dart 3.12 formatting [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
