name: ci

on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Finalize persistence patch and exact Dart formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/event_delivery/lib/src/indexed_db_event_store.dart')
          text = path.read_text()
          old = "RegExp(r'^[a-z0-9][a-z0-9_.-]{0,79}\\\\$')"
          new = "RegExp(r'^[a-z0-9][a-z0-9_.-]{0,79}$')"
          if text.count(old) != 1:
              raise SystemExit('consumer metadata regex anchor not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format \
            apps/mosaic_app/lib/consumer_local_state.dart \
            apps/mosaic_app/lib/consumer_local_state_native.dart \
            apps/mosaic_app/lib/consumer_local_state_web.dart \
            apps/mosaic_app/lib/event_runtime_resources.dart \
            apps/mosaic_app/lib/event_runtime_resources_native.dart \
            apps/mosaic_app/lib/event_runtime_resources_web.dart \
            apps/mosaic_app/test/app_event_runtime_test.dart \
            apps/mosaic_app/test/consumer_local_state_native_test.dart \
            apps/mosaic_app/test/consumer_recent_feed_native_test.dart \
            packages/event_delivery/lib/src/indexed_db_event_store.dart \
            packages/event_delivery/lib/src/indexed_db_event_store_stub.dart \
            packages/event_delivery/test_web/indexed_db_consumer_metadata_web_test.dart \
            packages/local_state/lib/local_state.dart \
            packages/local_state/test/consumer_recovery_v2_test.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/mosaic_app/lib/consumer_local_state.dart \
            apps/mosaic_app/lib/consumer_local_state_native.dart \
            apps/mosaic_app/lib/consumer_local_state_web.dart \
            apps/mosaic_app/lib/event_runtime_resources.dart \
            apps/mosaic_app/lib/event_runtime_resources_native.dart \
            apps/mosaic_app/lib/event_runtime_resources_web.dart \
            apps/mosaic_app/test/app_event_runtime_test.dart \
            apps/mosaic_app/test/consumer_local_state_native_test.dart \
            apps/mosaic_app/test/consumer_recent_feed_native_test.dart \
            packages/event_delivery/lib/src/indexed_db_event_store.dart \
            packages/event_delivery/lib/src/indexed_db_event_store_stub.dart \
            packages/event_delivery/test_web/indexed_db_consumer_metadata_web_test.dart \
            packages/local_state/lib/local_state.dart \
            packages/local_state/test/consumer_recovery_v2_test.dart
          git diff --cached --quiet && exit 0
          git commit -m 'style: finalize consumer persistence tranche [skip ci]'
          git push origin HEAD:${{ github.ref_name }}
