name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m2-feed-pager-20260829
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile
      - name: Patch retry edges and format tranche
        run: |
          python3 - <<'PY'
          from pathlib import Path

          feed = Path('apps/mosaic_app/lib/consumer_feed.dart')
          text = feed.read_text()
          anchor = '''      _fetching = false;
                _failure = result.failure;

                if (page != null) {'''
          replacement = '''      _fetching = false;
                _failure = result.failure;
                if (result.cursorReset && page == null) {
                  _nextCursor = null;
                }

                if (page != null) {'''
          if text.count(anchor) != 1:
              raise SystemExit('cursor-reset patch anchor mismatch')
          text = text.replace(anchor, replacement)
          old_retry = '''    await _fetchPage(cursor, epoch: _entries.isEmpty ? _loadEpoch : null);'''
          new_retry = '''    await _fetchPage(cursor, epoch: _loadEpoch);'''
          if text.count(old_retry) != 1:
              raise SystemExit('retry patch anchor mismatch')
          feed.write_text(text.replace(old_retry, new_retry))

          test = Path('apps/mosaic_app/test/consumer_feed_test.dart')
          text = test.read_text()
          if text.count("'format': 'tap',") != 1:
              raise SystemExit('test format patch anchor mismatch')
          test.write_text(text.replace("'format': 'tap',", "'format': 'play',"))
          PY

          dart format \
            apps/mosaic_app/lib/consumer_feed.dart \
            apps/mosaic_app/lib/main.dart \
            apps/mosaic_app/test/consumer_feed_test.dart
          git checkout HEAD^ -- .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml \
                  apps/mosaic_app/lib/consumer_feed.dart \
                  apps/mosaic_app/lib/main.dart \
                  apps/mosaic_app/test/consumer_feed_test.dart
          git commit -m 'fix(m2): harden feed retries and format tranche'
          git push origin HEAD:agent/m2-feed-pager-20260829
