name: m2-feed-format

on:
  push:
    branches: ['agent/m2-feed-pager-20260829']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m2-feed-pager-20260829
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile
      - name: Format and push feed product file
        run: |
          dart format apps/mosaic_app/lib/consumer_feed.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mosaic_app/lib/consumer_feed.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style(m2): format feed cursor fence'
          git push origin HEAD:agent/m2-feed-pager-20260829
