name: ci

on:
  push:
    branches: ['agent/m2-managed-asset-delivery-20260829']

permissions:
  contents: write

jobs:
  format-media-failure-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m2-managed-asset-delivery-20260829
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Format regression
        run: dart format apps/mosaic_app/test/media_failure_paging_test.dart
      - name: Commit product formatting
        run: |
          git add apps/mosaic_app/test/media_failure_paging_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(app): format media failure paging test"
          git push origin HEAD:agent/m2-managed-asset-delivery-20260829
