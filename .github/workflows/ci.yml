name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile
      - name: Apply exact event formatting
        run: |
          dart format packages/event_delivery/lib/src/event_delivery_core.dart packages/event_delivery/lib/src/indexed_db_event_store.dart packages/event_delivery/test/event_delivery_core_test.dart packages/event_delivery/test/http_event_transport_test.dart packages/event_delivery/test/sqlite_event_outbox_test.dart
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/event_delivery
          git commit -m 'style(events): apply exact Dart formatter output [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
