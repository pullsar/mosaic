name: m2-delivery-storage-patch

on:
  push:
    branches: ['agent/m2-managed-asset-delivery-20260829']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m2-managed-asset-delivery-20260829
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Patch and validate delivery storage wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {count}')
              p.write_text(text.replace(old, new))

          replace_once(
              'apps/api/src/media_s3_storage.ts',
              "import type {\n  MediaObjectPutRequest,\n  MediaObjectStore,\n  MediaStoredObject,\n} from './media_object_store.js';\n",
              "import type {\n  MediaObjectPutRequest,\n  MediaObjectStore,\n  MediaStoredObject,\n} from './media_object_store.js';\nimport type {\n  MediaByteRange,\n  MediaDeliveryObjectInspection,\n} from './media_delivery.js';\n",
              's3 delivery type imports',
          )

          s3_methods = """  async inspect(
            storageKey: string,
            signal?: AbortSignal,
          ): Promise<MediaDeliveryObjectInspection | null> {
            const stored = await this.headObject(storageKey, signal);
            return stored === null
              ? null
              : {sizeBytes: stored.sizeBytes, mimeType: stored.mimeType};
          }

          async openRange(
            storageKey: string,
            range: MediaByteRange,
            signal?: AbortSignal,
          ): Promise<Readable> {
            const key = normalizeStorageKey(storageKey);
            if (
              !Number.isSafeInteger(range.start) ||
              !Number.isSafeInteger(range.endInclusive) ||
              range.start < 0 ||
              range.endInclusive < range.start
            ) {
              throw new TypeError('S3 media delivery range must be a valid inclusive byte range');
            }
            abortIfRequested(signal);
            const url = this.objectUrl(key);
            const requestSignal = this.requestSignal(signal);
            const rangeHeader = `bytes=${range.start}-${range.endInclusive}`;
            const signed = this.sign('GET', url, EMPTY_SHA256, {range: rangeHeader});
            const response = await this.fetcher(url, {
              method: 'GET',
              headers: requestHeaders(signed),
              signal: requestSignal,
            });
            if (response.status !== 206 || response.body === null) {
              await discardBody(response);
              throw new S3MediaStorageError(
                `S3 ranged GET ${key} failed with HTTP ${response.status}`,
              );
            }
            const expectedLength = range.endInclusive - range.start + 1;
            const actualLength = requiredContentLength(response.headers, key);
            if (actualLength !== expectedLength) {
              await discardBody(response);
              throw new S3MediaStorageError(
                `S3 ranged GET ${key} length ${actualLength} != ${expectedLength}`,
              );
            }
            assertContentRange(response.headers, key, range);
            requiredMimeType(response.headers, key);
            return Readable.fromWeb(response.body as ReadableStream<Uint8Array>);
          }

"""
          replace_once(
              'apps/api/src/media_s3_storage.ts',
              '  async downloadVerifiedObject(request: S3VerifiedDownloadRequest): Promise<string> {',
              s3_methods + '  async downloadVerifiedObject(request: S3VerifiedDownloadRequest): Promise<string> {',
              's3 delivery methods',
          )

          content_range_helper = """function assertContentRange(
            headers: Headers,
            storageKey: string,
            range: MediaByteRange,
          ): void {
            const raw = headers.get('content-range');
            const match = raw === null ? null : /^bytes (\\d+)-(\\d+)\\/(\\d+)$/.exec(raw);
            if (match === null) {
              throw new S3MediaStorageError(
                `S3 ranged object ${storageKey} has no valid Content-Range`,
              );
            }
            const start = Number(match[1]);
            const endInclusive = Number(match[2]);
            const total = Number(match[3]);
            if (
              !Number.isSafeInteger(start) ||
              !Number.isSafeInteger(endInclusive) ||
              !Number.isSafeInteger(total) ||
              start !== range.start ||
              endInclusive !== range.endInclusive ||
              total <= endInclusive
            ) {
              throw new S3MediaStorageError(
                `S3 ranged object ${storageKey} returned an unexpected Content-Range`,
              );
            }
          }

"""
          replace_once(
              'apps/api/src/media_s3_storage.ts',
              'function requiredMimeType(headers: Headers, storageKey: string): string {',
              content_range_helper + 'function requiredMimeType(headers: Headers, storageKey: string): string {',
              's3 content-range helper',
          )

          replace_once(
              'apps/api/src/server.ts',
              "import {loadConfig} from './config.js';\n",
              "import {loadConfig} from './config.js';\nimport {loadMediaDeliveryStorageConfig} from './media_delivery_config.js';\nimport {MediaDeliveryService} from './media_delivery.js';\nimport {LocalMediaDeliveryObjectReader} from './media_delivery_local_storage.js';\nimport {registerMediaDeliveryRoutes} from './media_delivery_routes.js';\nimport {PostgresMediaPublicationGate} from './media_publication.js';\nimport {S3CompatibleMediaStorage} from './media_s3_storage.js';\n",
              'server imports',
          )
          server_wiring = """

const mediaDeliveryConfig = loadMediaDeliveryStorageConfig();
if (mediaDeliveryConfig.storageMode !== 'disabled') {
  const publication = new PostgresMediaPublicationGate(pool);
  const reader = mediaDeliveryConfig.storageMode === 'local'
    ? new LocalMediaDeliveryObjectReader(mediaDeliveryConfig.objectRoot)
    : new S3CompatibleMediaStorage({
        endpoint: mediaDeliveryConfig.s3Endpoint,
        bucket: mediaDeliveryConfig.s3Bucket,
        region: mediaDeliveryConfig.s3Region,
        accessKeyId: mediaDeliveryConfig.s3AccessKeyId,
        secretAccessKey: mediaDeliveryConfig.s3SecretAccessKey,
        ...(mediaDeliveryConfig.s3SessionToken === undefined
          ? {}
          : {sessionToken: mediaDeliveryConfig.s3SessionToken}),
        requestTimeoutMs: mediaDeliveryConfig.storageTimeoutMs,
      });
  registerMediaDeliveryRoutes(app, new MediaDeliveryService(publication, reader));
}
"""
          replace_once(
              'apps/api/src/server.ts',
              "  allowedWebOrigins: config.allowedWebOrigins,\n});\n",
              "  allowedWebOrigins: config.allowedWebOrigins,\n});" + server_wiring,
              'server delivery wiring',
          )

          replace_once(
              'apps/api/src/app.ts',
              "const CORS_METHODS = 'GET,POST,PUT,OPTIONS';\nconst CORS_HEADERS = 'content-type,authorization';",
              "const CORS_METHODS = 'GET,HEAD,POST,PUT,OPTIONS';\nconst CORS_HEADERS = 'content-type,authorization,range';\nconst CORS_EXPOSE_HEADERS = 'accept-ranges,content-length,content-range';",
              'cors constants',
          )
          replace_once(
              'apps/api/src/app.ts',
              "    reply.header('access-control-allow-headers', CORS_HEADERS);\n    reply.header('access-control-max-age', '600');",
              "    reply.header('access-control-allow-headers', CORS_HEADERS);\n    reply.header('access-control-expose-headers', CORS_EXPOSE_HEADERS);\n    reply.header('access-control-max-age', '600');",
              'cors expose headers',
          )

          replace_once(
              'apps/api/test/app.test.ts',
              "  assert.equal(preflight.headers['access-control-allow-methods'], 'GET,POST,PUT,OPTIONS');\n  assert.equal(preflight.headers['access-control-allow-headers'], 'content-type,authorization');",
              "  assert.equal(preflight.headers['access-control-allow-methods'], 'GET,HEAD,POST,PUT,OPTIONS');\n  assert.equal(preflight.headers['access-control-allow-headers'], 'content-type,authorization,range');\n  assert.equal(\n    preflight.headers['access-control-expose-headers'],\n    'accept-ranges,content-length,content-range',\n  );",
              'cors test expectations',
          )

          s3_test = Path('apps/api/test/media_s3_storage.test.ts')
          text = s3_test.read_text()
          if "S3 delivery reader verifies HEAD metadata" in text:
              raise SystemExit('s3 delivery tests already present')
          text += r'''

test('S3 delivery reader verifies HEAD metadata and streams an exact signed byte range', async () => {
  const bytes = Buffer.from('0123456789');
  const sha256 = digest(bytes);
  const methods: string[] = [];
  const store = storage(async (_input, init) => {
    const method = init?.method ?? 'GET';
    methods.push(method);
    if (method === 'HEAD') {
      return new Response(null, {
        status: 200,
        headers: {
          'content-length': String(bytes.length),
          'content-type': 'video/mp4',
          'x-amz-meta-mosaic-sha256': sha256,
        },
      });
    }
    assert.equal(method, 'GET');
    assert.equal(headers(init).get('range'), 'bytes=2-5');
    assert.match(headers(init).get('authorization') ?? '', /^AWS4-HMAC-SHA256 /);
    return new Response(bytes.subarray(2, 6), {
      status: 206,
      headers: {
        'content-length': '4',
        'content-range': 'bytes 2-5/10',
        'content-type': 'video/mp4',
      },
    });
  });

  assert.deepEqual(await store.inspect('media/asset/video.mp4'), {
    sizeBytes: 10,
    mimeType: 'video/mp4',
  });
  const stream = await store.openRange(
    'media/asset/video.mp4',
    {start: 2, endInclusive: 5},
  );
  const chunks: Buffer[] = [];
  for await (const chunk of stream) chunks.push(Buffer.from(chunk));
  assert.equal(Buffer.concat(chunks).toString('utf8'), '2345');
  assert.deepEqual(methods, ['HEAD', 'GET']);
});

test('S3 delivery reader rejects non-partial or inconsistent range responses', async () => {
  const badStatus = storage(async () =>
    new Response(Buffer.from('0123'), {
      status: 200,
      headers: {'content-length': '4', 'content-type': 'video/mp4'},
    }),
  );
  await assert.rejects(
    badStatus.openRange('media/asset/video.mp4', {start: 0, endInclusive: 3}),
    /ranged GET.*HTTP 200/,
  );

  const badRange = storage(async () =>
    new Response(Buffer.from('0123'), {
      status: 206,
      headers: {
        'content-length': '4',
        'content-range': 'bytes 1-4/10',
        'content-type': 'video/mp4',
      },
    }),
  );
  await assert.rejects(
    badRange.openRange('media/asset/video.mp4', {start: 0, endInclusive: 3}),
    /unexpected Content-Range/,
  );
});
'''
          s3_test.write_text(text)

          replace_once(
              'apps/api/.env.example',
              'MOSAIC_WEB_ORIGINS=\n\n',
              '''MOSAIC_WEB_ORIGINS=

# Consumer media delivery is disabled until explicitly configured on the API.
# Local mode reads only immutable derivative objects. S3 mode reuses MEDIA_S3_*
# below; storage object keys and credentials are never exposed to clients.
MEDIA_DELIVERY_STORAGE_MODE=disabled
MEDIA_DELIVERY_STORAGE_TIMEOUT_MS=60000
# MEDIA_DELIVERY_OBJECT_ROOT=/srv/mosaic/objects

''',
              'delivery env config',
          )
          PY

          cd apps/api
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .env.example src/app.ts src/server.ts src/media_s3_storage.ts test/app.test.ts test/media_s3_storage.test.ts
          git commit -m 'feat(m2): wire private media storage delivery'
          git push origin HEAD:agent/m2-managed-asset-delivery-20260829
