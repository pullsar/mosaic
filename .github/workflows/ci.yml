name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Format workspace
        run: |
          dart format .
          git diff --binary > /tmp/dart-format.patch
      - name: Analyze
        run: flutter analyze
      - name: Test play_schema
        working-directory: packages/play_schema
        run: dart test
      - name: Test play_engine
        working-directory: packages/play_engine
        run: dart test
      - name: Test analytics_contract
        working-directory: packages/analytics_contract
        run: dart test
      - name: Test play_flutter
        working-directory: packages/play_flutter
        run: flutter test
      - name: Test app shell
        working-directory: apps/mosaic_app
        run: flutter test
      - name: Upload formatter patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dart-format-patch
          path: /tmp/dart-format.patch
          if-no-files-found: error
          retention-days: 1
      - name: Verify committed formatting
        run: git diff --exit-code
