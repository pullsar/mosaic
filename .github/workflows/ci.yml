name: ci

on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Apply bounded outbox patch
        run: |
          python3 .tmp_event_patch.py
          dart format packages/local_state/lib/local_state.dart packages/local_state/test/local_state_test.dart packages/event_delivery/lib/src/indexed_db_event_store.dart packages/event_delivery/test_web/indexed_db_event_store_web_test.dart
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/local_state/lib/local_state.dart packages/local_state/test/local_state_test.dart packages/event_delivery/lib/src/indexed_db_event_store.dart packages/event_delivery/test_web/indexed_db_event_store_web_test.dart docs/event-delivery.md
          git commit -m 'fix(events): hard-bound durable event queues [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
