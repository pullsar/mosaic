name: format-media-compat-once

on:
  push:
    branches:
      - agent/m07-media-compat-20260828
    paths:
      - '.github/workflows/format-media-compat-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m07-media-compat-20260828
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile
      - name: Canonical format
        run: |
          dart format \
            packages/play_flutter/lib/src/play_video_asset_codec.dart \
            packages/play_flutter/lib/src/play_video_renderer.dart \
            packages/play_flutter/lib/src/play_media_layer_renderer.dart \
            packages/play_flutter/lib/src/video_player_adapter.dart \
            packages/play_flutter/test/play_video_compatibility_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Test compatibility tranche
        working-directory: packages/play_flutter
        run: flutter test test/play_video_compatibility_test.dart
      - name: Run complete renderer suite
        working-directory: packages/play_flutter
        run: flutter test
      - name: Remove one-shot workflow
        run: rm .github/workflows/format-media-compat-once.yml
      - name: Commit canonical source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/play_flutter .github/workflows/format-media-compat-once.yml
          if git diff --cached --quiet; then
            echo 'No canonical changes to commit.'
            exit 0
          fi
          git commit -m 'style(media): canonicalize compatibility tranche'
          git push origin HEAD:agent/m07-media-compat-20260828
