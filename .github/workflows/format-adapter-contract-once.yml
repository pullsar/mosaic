name: format-adapter-contract-once

on:
  push:
    branches:
      - agent/m06-play-renderer-20260828

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m06-play-renderer-20260828
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile
      - name: Canonical format
        run: dart format packages/play_flutter/test/production_media_adapter_contract_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Test production adapter contract
        working-directory: packages/play_flutter
        run: flutter test test/production_media_adapter_contract_test.dart
      - name: Remove one-shot workflow
        run: git rm .github/workflows/format-adapter-contract-once.yml
      - name: Commit format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/play_flutter/test/production_media_adapter_contract_test.dart
          git commit -am "test(renderer): format production adapter contract"
          git push origin HEAD:agent/m06-play-renderer-20260828
