name: m2-temp-polish

on:
  push:
    branches: ['agent/m2-visual-onboarding-20260829']

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m2-visual-onboarding-20260829
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Patch reviewed UX edges, format, and remove workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/mosaic_app/lib/consumer_onboarding.dart')
          text = path.read_text()

          old_search = '''  void _onSearchChanged(String value) {
            _searchTimer?.cancel();
          '''
          new_search = '''  void _onSearchChanged(String value) {
            if (mounted) setState(() {});
            _searchTimer?.cancel();
          '''
          if text.count(old_search) != 1:
              raise SystemExit('search-change patch anchor mismatch')
          text = text.replace(old_search, new_search)

          start_marker = '        child: step == _OnboardingStep.interests'
          end_marker = '\n      ),\n    );\n  }\n}\n\nfinal class _OnboardingBootSurface'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('footer patch anchor mismatch')
          replacement = '''        child: step == _OnboardingStep.interests
              ? OverflowBar(
                  spacing: 12,
                  overflowSpacing: 4,
                  alignment: MainAxisAlignment.spaceBetween,
                  overflowAlignment: OverflowBarAlignment.end,
                  children: <Widget>[
                    TextButton(
                      onPressed: busy ? null : onSurprise,
                      child: Text(strings.surpriseMe),
                    ),
                    FilledButton(
                      key: const ValueKey<String>('interests-continue'),
                      onPressed: busy ? null : onContinueInterests,
                      style: primaryStyle,
                      child: Text(strings.continueLabel),
                    ),
                  ],
                )
              : OverflowBar(
                  spacing: 12,
                  overflowSpacing: 4,
                  alignment: MainAxisAlignment.spaceBetween,
                  overflowAlignment: OverflowBarAlignment.end,
                  children: <Widget>[
                    Row(
                      mainAxisSize: MainAxisSize.min,
                      children: <Widget>[
                        IconButton(
                          key: const ValueKey<String>('learning-back'),
                          tooltip: strings.back,
                          onPressed: busy ? null : onBack,
                          icon: const BackButtonIcon(),
                        ),
                        const SizedBox(width: 4),
                        TextButton(
                          onPressed: busy ? null : onSkipLearning,
                          child: Text(strings.skip),
                        ),
                      ],
                    ),
                    FilledButton(
                      key: const ValueKey<String>('learning-continue'),
                      onPressed: busy ? null : onFinish,
                      style: primaryStyle,
                      child: Text(strings.continueLabel),
                    ),
                  ],
                ),'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

          dart format \
            apps/mosaic_app/lib/consumer_onboarding.dart \
            apps/mosaic_app/test/consumer_local_state_native_test.dart \
            apps/mosaic_app/test/consumer_onboarding_test.dart
          git rm .github/workflows/m2-temp-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mosaic_app/lib/consumer_onboarding.dart \
                  apps/mosaic_app/test/consumer_local_state_native_test.dart \
                  apps/mosaic_app/test/consumer_onboarding_test.dart
          git commit -m 'fix(m2): harden onboarding responsive controls'
          git push origin HEAD:agent/m2-visual-onboarding-20260829
