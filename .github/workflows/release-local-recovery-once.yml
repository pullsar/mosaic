name: release-local-recovery-once

on:
  push:
    branches: ['agent/m05-local-recovery-20260827']
    paths:
      - '.github/workflows/release-local-recovery-once.yml'

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge-after-exact-head-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: pullsar/mosaic
      BRANCH: agent/m05-local-recovery-20260827
      READY: .release-gates/local-recovery-ready
      MARKER: packages/local_state/.local-recovery-release-gate
    steps:
      - name: Wait for finalized branch and connector-authored marker
        id: target
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 360); do
            ready=false
            marker=false
            gh api "repos/$REPOSITORY/contents/$READY?ref=$BRANCH" >/dev/null 2>&1 && ready=true
            gh api "repos/$REPOSITORY/contents/$MARKER?ref=$BRANCH" >/dev/null 2>&1 && marker=true
            if [[ "$ready" == true && "$marker" == true ]]; then
              target=$(gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
              echo "sha=$target" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo 'Finalized branch marker was not published in time.' >&2
          exit 1

      - name: Wait for repository and local recovery gates
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            current=$(gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
            if [[ "$current" != "$TARGET_SHA" ]]; then
              echo "Branch moved while validating: expected $TARGET_SHA, found $current" >&2
              exit 1
            fi
            runs=$(gh api -X GET "repos/$REPOSITORY/actions/runs" -f head_sha="$TARGET_SHA" -f per_page=100)
            local_state=$(jq -r '[.workflow_runs[] | select(.name == "local-recovery-ci")] | sort_by(.created_at) | last | if . == null then "missing:" else "\(.status):\(.conclusion // "")" end' <<<"$runs")
            repository=$(jq -r '[.workflow_runs[] | select(.name == "ci")] | sort_by(.created_at) | last | if . == null then "missing:" else "\(.status):\(.conclusion // "")" end' <<<"$runs")
            echo "local-recovery-ci=$local_state ci=$repository"
            for state in "$local_state" "$repository"; do
              status=${state%%:*}
              conclusion=${state#*:}
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                echo "Required gate failed: $state" >&2
                exit 1
              fi
            done
            if [[ "$local_state" == completed:success && "$repository" == completed:success ]]; then
              exit 0
            fi
            sleep 20
          done
          echo 'Timed out waiting for exact-head gates.' >&2
          exit 1

      - name: Remove temporary gate files and merge the validated branch
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repository
          cd repository
          git checkout "$BRANCH"
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          git merge-base --is-ancestor origin/main HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm ".github/workflows/release-local-recovery-once.yml" "$READY" "$MARKER"
          git commit -m 'chore(local): remove temporary release gates'
          git push origin "$BRANCH"

          pr=$(gh pr list --repo "$REPOSITORY" --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            url=$(gh pr create \
              --repo "$REPOSITORY" \
              --head "$BRANCH" \
              --base main \
              --title 'feat(local): add durable process-death recovery foundation' \
              --body $'Closes #14\n\nAdds the deliberately small sqlite3-backed durable local layer for anonymous identity and binding, distinct interest state, bounded feed resume, creator drafts, local asset/upload metadata, stable-ID event outbox deduplication, bounded exponential retry, priority-aware spool pressure, schema migration, and corrupt-database quarantine/recovery. Process-restart tests and the recovery contract are included.\n\nThe exact code-bearing parent passed repository CI plus dedicated lock, format, analysis, restart, retry, spool-pressure, and corruption-recovery gates. The final child removes only temporary release markers and this workflow.' )
            pr=${url##*/}
          fi
          for _ in $(seq 1 24); do
            mergeable=$(gh pr view "$pr" --repo "$REPOSITORY" --json mergeable --jq .mergeable)
            [[ "$mergeable" != UNKNOWN ]] && break
            sleep 5
          done
          [[ "$mergeable" == MERGEABLE ]]
          gh pr merge "$pr" --repo "$REPOSITORY" --merge --delete-branch=false
