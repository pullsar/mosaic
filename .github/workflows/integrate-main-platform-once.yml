name: integrate-main-platform-once

on:
  push:
    branches: ['agent/m05-platform-lifecycle-20260827']
    paths:
      - '.github/workflows/integrate-main-platform-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout platform branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m05-platform-lifecycle-20260827
          fetch-depth: 0
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Merge current main and regenerate the authoritative workspace lock
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            unexpected=$(printf '%s\n' "$conflicts" | grep -Ev '^(pubspec\.yaml|pubspec\.lock)$' || true)
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected merge conflicts:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
          fi

          cat > pubspec.yaml <<'YAML'
          name: mosaic_workspace
          publish_to: none
          environment:
            sdk: '>=3.12.0 <4.0.0'
          workspace:
            - apps/mosaic_app
            - packages/play_schema
            - packages/play_engine
            - packages/play_flutter
            - packages/analytics_contract
            - packages/platform_contracts
            - packages/platform_flutter
            - packages/local_state
          YAML

          rm -f pubspec.lock
          dart pub token remove https://pub.dev >/dev/null 2>&1 || true
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos
          (cd packages/platform_contracts && dart test --reporter=expanded)
          (cd packages/platform_flutter && flutter test --reporter=expanded)
          (cd packages/local_state && dart test --reporter=expanded)
          (cd apps/mosaic_app && flutter test --reporter=expanded)
          git diff --check

          git rm .github/workflows/integrate-main-platform-once.yml
          git add pubspec.yaml pubspec.lock
          git add -A
          git commit -m 'chore(platform): integrate local recovery foundation'
          git push origin HEAD:agent/m05-platform-lifecycle-20260827
