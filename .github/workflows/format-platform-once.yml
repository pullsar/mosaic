name: format-platform-once

on:
  push:
    branches: ['agent/m05-platform-lifecycle-20260827']
    paths:
      - '.github/workflows/format-platform-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m05-platform-lifecycle-20260827
          fetch-depth: 0
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Format and remove this one-shot workflow
        run: |
          set -euo pipefail
          dart format \
            packages/platform_contracts/lib/platform_contracts.dart \
            packages/platform_contracts/test/platform_contracts_test.dart
          git rm .github/workflows/format-platform-once.yml
          git add packages/platform_contracts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(platform): apply canonical Dart formatting'
          git push origin HEAD:agent/m05-platform-lifecycle-20260827
