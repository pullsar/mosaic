name: format-play-performance-once

on:
  push:
    branches:
      - agent/m06-golden-perf-20260828

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m06-golden-perf-20260828
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve locked workspace
        run: flutter pub get --enforce-lockfile
      - name: Canonical format
        run: dart format packages/play_flutter/lib/src/play_performance_probe.dart packages/play_flutter/test/play_performance_probe_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Test profiling contract
        working-directory: packages/play_flutter
        run: flutter test test/play_performance_probe_test.dart
      - name: Run complete renderer suite
        working-directory: packages/play_flutter
        run: flutter test
      - name: Remove one-shot workflow
        run: git rm .github/workflows/format-play-performance-once.yml
      - name: Commit canonical source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/play_flutter/lib/src/play_performance_probe.dart packages/play_flutter/test/play_performance_probe_test.dart
          git commit -am "style(renderer): canonicalize performance probe"
          git push origin HEAD:agent/m06-golden-perf-20260828
