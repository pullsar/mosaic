name: format-brand-kit-once

on:
  push:
    branches:
      - agent/format-brand-kit-20260828

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/format-brand-kit-20260828
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Canonical format
        run: dart format mixli-brand-kit-v2/06_tokens/mixli_brand_tokens.dart
      - name: Remove one-shot workflow
        run: git rm .github/workflows/format-brand-kit-once.yml
      - name: Commit format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mixli-brand-kit-v2/06_tokens/mixli_brand_tokens.dart
          git commit -m "style: format brand kit Dart tokens"
          git push origin HEAD:agent/format-brand-kit-20260828
