name: lock-renderer-media-once

on:
  push:
    branches:
      - agent/m06-play-renderer-20260828
    paths:
      - packages/play_flutter/pubspec.yaml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/m06-play-renderer-20260828
      - name: Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.7'
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Remove one-shot workflow
        run: git rm .github/workflows/lock-renderer-media-once.yml
      - name: Commit authoritative lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git diff --cached --quiet && git diff --quiet || git commit -m "chore(renderer): lock production media dependencies"
          git push origin HEAD:agent/m06-play-renderer-20260828
