global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: mixli-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-blue-1:8080
          - api-blue-2:8080
          - api-green-1:8080
          - api-green-2:8080

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
