groups:
  - name: mixli-availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Prometheus target {{ $labels.job }}/{{ $labels.instance }} is down"

      - alert: ApiUnavailable
        expr: sum(up{job="mixli-api"}) == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: All Mixli API replicas are unavailable

      - alert: ApiHigh5xxRatio
        expr: sum(rate(mixli_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(mixli_http_requests_total[5m])), 0.001) > 0.02
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Mixli API 5xx ratio is above 2 percent

      - alert: ApiHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(mixli_http_request_duration_seconds_bucket[10m]))) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Mixli API p95 latency is above 500 ms

  - name: mixli-capacity
    rules:
      - alert: HostDiskLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Host filesystem has less than 15 percent free space

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Host has less than 10 percent available memory

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name=~"mixli.*"}[15m]) > 2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: A Mixli container is repeatedly restarting

  - name: mixli-database-recovery
    rules:
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: PostgreSQL exporter is unavailable

      - alert: PostgreSQLConnectionsHigh
        expr: sum(pg_stat_database_numbackends) / clamp_min(max(pg_settings_max_connections), 1) > 0.80
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: PostgreSQL connections exceed 80 percent

      - alert: BackupStale
        expr: (time() - mixli_pgbackrest_last_backup_success_timestamp > 93600) or absent(mixli_pgbackrest_last_backup_success_timestamp)
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: No successful dual-repository backup in 26 hours

      - alert: WalArchiveStale
        expr: pg_stat_archiver_last_archive_age > 900
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: PostgreSQL WAL archive is more than 15 minutes stale

      - alert: RestoreVerificationStale
        expr: (time() - mixli_pgbackrest_last_restore_verify_success_timestamp > 3024000) or absent(mixli_pgbackrest_last_restore_verify_success_timestamp)
        for: 1h
        labels: {severity: critical}
        annotations:
          summary: No successful isolated restore verification in 35 days
