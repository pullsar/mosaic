user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format mixli_json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$mixli_request_id",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_time":"$upstream_response_time"}';

    access_log /dev/stdout mixli_json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    server_tokens off;

    client_max_body_size 16m;
    client_body_timeout 15s;
    send_timeout 30s;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_request_id $mixli_request_id {
        default $http_x_request_id;
        '' $request_id;
    }

    include /etc/nginx/mixli/cloudflare-real-ip.conf;
    include /etc/nginx/runtime/api-upstream.conf;
    include /etc/nginx/mixli/conf.d/mixli.conf;
}
