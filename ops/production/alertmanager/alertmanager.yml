global:
  resolve_timeout: 5m

route:
  receiver: mixli-operations
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: mixli-operations
    webhook_configs:
      - send_resolved: true
        url_file: /etc/alertmanager/secrets/webhook-url
